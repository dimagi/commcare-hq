{% load i18n %}
{% load hq_shared_tags %}

{% if record.allow_email %}
  <span
    class="badge fs-6 fa-regular bg-primary-subtle text-primary-emphasis"
    title="{% trans_html_attr "Email enabled" %}"
  >
    <i class="fa-regular fa-envelope" aria-hidden="true"></i>
    <span class="visually-hidden">{% trans "Email enabled" %}</span>
  </span>
{% else %}
  <span
    class="badge fs-6 fa-regular bg-light text-body-tertiary"
    title="{% trans_html_attr "Email disabled" %}"
  >
    <i class="fa-regular fa-envelope" aria-hidden="true"></i>
    <span class="visually-hidden">{% trans "Email disabled" %}</span>
  </span>
{% endif %}
{% if record.allow_sms %}
  <span
    class="badge fs-6 fa-regular bg-primary-subtle text-primary-emphasis"
    title="{% trans_html_attr "SMS enabled" %}"
  >
    <i class="fa-regular fa-comment" aria-hidden="true"></i>
    <span class="visually-hidden">{% trans "SMS enabled" %}</span>
  </span>
{% else %}
  <span
    class="badge fs-6 fa-regular bg-light text-body-tertiary"
    title="{% trans_html_attr "SMS disabled" %}"
  >
    <i class="fa-regular fa-comment" aria-hidden="true"></i>
    <span class="visually-hidden">{% trans "SMS disabled" %}</span>
  </span>
{% endif %}
