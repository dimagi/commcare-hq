{% extends "hqwebapp/bootstrap5/base_section.html" %}
{% load i18n crispy_forms_tags %}
{% block page_content %}
  {% crispy form %}
  {% if form.instance.pk %}
    <form
      method="post"
      action="{% url 'letter_template_delete' domain form.instance.pk %}"
      class="mt-3"
    >
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-danger">
        <i class="fa fa-trash"></i> {% trans "Delete template" %}
      </button>
    </form>
  {% endif %}
{% endblock %}
