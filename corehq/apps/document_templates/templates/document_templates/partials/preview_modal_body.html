{% load i18n %}

{% if error %}
  <div class="alert alert-danger mb-0" role="alert">{{ error }}</div>
{% else %}
  {% for name, value in context.items %}
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <label for="preview-{{ name }}" class="form-label fw-semibold"
          >{{ name }}</label
        >
      </div>
      <div class="col-md-8">
        <input
          type="text"
          id="preview-{{ name }}"
          name="{{ field_prefix }}{{ name }}"
          value="{{ value }}"
          class="form-control"
        />
      </div>
    </div>
    {% empty %}
    <p class="mb-0">{% trans "The template does not use any variables." %}</p>
  {% endfor %}
{% endif %}
