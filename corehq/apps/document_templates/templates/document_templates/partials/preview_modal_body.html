{% load i18n %}

{% if error %}
  <div class="alert alert-danger mb-0" role="alert">{{ error }}</div>
{% else %}
  <label for="preview-context" class="form-label fw-semibold"
    >{% trans "Values for the variables used in the document" %}</label
  >
  <textarea
    id="preview-context"
    name="context"
    class="form-control font-monospace"
    rows="12"
    spellcheck="false"
  >
{{ context_json }}</textarea
  >
{% endif %}
