Fixture:
  type: object
  description: >-
    A single fixture data item (a row of a lookup table), as returned by the
    read-only `fixture/v1` API. `FixtureResource` (`v0_1.py:45-96`) wraps
    `LookupTableRow`.
  properties:
    id:
      type: string
      description: Fixture item (lookup table row) UUID.
      example: 1J9NF7B4FTH73435PYJJSL5SJ
    fixture_type:
      type: string
      nullable: true
      description: >-
        Name (`tag`) of the row's lookup table. Null when the referenced lookup
        table no longer exists -- `convert_fdt` (`v0_1.py:25-42`) leaves
        `fixture_type` unset in that case, and the field is declared `null=True`
        (`v0_1.py:49-50`).
      example: city
    fields:
      type: object
      additionalProperties: true
      description: >-
        Values for the row's custom fields, keyed by field name.
        `dehydrate_fields` (`v0_1.py:53-57`) returns
        `bundle.obj.fields_without_attributes`.
      example:
        name: Boston
        population: 617594
        state: Massachusetts
    resource_uri:
      type: string
      description: >-
        Always empty. `FixtureResource` participates in tastypie's
        `get_resource_uri`, but the reverse lookup always raises
        `NoReverseMatch` for this resource, which is caught and returns `''`
        (`tastypie/resources.py:810-829`). Every sample in `fixture.rst` shows
        this as `""`.
      example: ""
FixtureList:
  allOf:
    - $ref: "./pagination.yaml#/PaginatedResponse"
    - type: object
      properties:
        objects:
          type: array
          items:
            $ref: "#/Fixture"

LookupTable:
  type: object
  description: >-
    A lookup table's schema (its tag, fields, and global flag), as managed by
    `LookupTableResource` (`v0_1.py:111-246`). Note this resource does not
    accept a `description` field -- `LookupTable.description` exists on the
    model but `LookupTableResource` never declares it as an API field.
  properties:
    id:
      type: string
      description: Lookup table UUID.
      example: bcf49791f7f04f09bd46262097e107f2
    tag:
      type: string
      description: Lookup table name (the "Table ID" shown in the UI).
      example: vaccines
    is_global:
      type: boolean
      description: Whether the table is accessible to all users.
      example: true
    fields:
      type: array
      description: >-
        The table's column definitions. `dehydrate_fields` (`v0_1.py:161-168`)
        always emits the `field_name`/`properties` shape shown here, even though
        the resource's own write-side JSON Schema validator (`v0_1.py:133-159`)
        also accepts a bare `name` key on input.
      items:
        type: object
        properties:
          field_name:
            type: string
            example: name
          properties:
            type: array
            items:
              type: string
            example:
              - lang
    item_attributes:
      type: array
      description: >-
        Names of the row-level attributes available on this table's items. Not
        shown in any `fixture.rst` sample output, but a genuine declared field
        (`v0_1.py:131`).
      items:
        type: string
      example: []
    resource_uri:
      type: string
      description: Always empty. Same mechanism as `Fixture.resource_uri`.
      example: ""
LookupTableList:
  allOf:
    - $ref: "./pagination.yaml#/PaginatedResponse"
    - type: object
      properties:
        objects:
          type: array
          items:
            $ref: "#/LookupTable"
LookupTableWrite:
  type: object
  description: >-
    Payload for creating or replacing a lookup table. `tag` is required on both
    create and replace (`obj_create`/`obj_update`, `v0_1.py:193-236`). On
    replace, the submitted `tag` must match the existing table's `tag` exactly
    -- `obj_update` raises a 400 (`"Lookup table tag cannot be changed"`)
    otherwise; this constraint is not mentioned in `fixture.rst`.
  required: [tag]
  properties:
    tag:
      type: string
      example: vaccines
    fields:
      type: array
      items:
        type: object
        properties:
          field_name:
            type: string
          properties:
            type: array
            items:
              type: string
        example:
          field_name: name
          properties: [lang]
      example:
        - field_name: name
          properties: [lang]
        - field_name: price
          properties: []
    is_global:
      type: boolean
      description: "Default: false."
      example: true
    item_attributes:
      type: array
      items:
        type: string
LookupTableErrorMessage:
  type: object
  description: >-
    Generic canned-error body produced by tastypie's exception handler
    (`_handle_500`, `tastypie/resources.py:291-315`) whenever `NotFound` or
    `ObjectDoesNotExist` propagates uncaught out of an operation that does not
    itself catch it -- keyed `error_message`, not the `error` key used by the
    shared `Error` schema, and not resource-specific text.
  properties:
    error_message:
      type: string
      example:
        Sorry, this request could not be processed. Please try again later.

LookupTableItem:
  type: object
  description: >-
    A single lookup table row, as managed by `LookupTableItemResource`
    (`v0_1.py:268-418`).
  properties:
    id:
      type: string
      description: Lookup table row UUID.
      example: e8433b25e60c4e228b0c7a679af2847b
    data_type_id:
      type: string
      description: UUID of the row's lookup table (`attribute='table_id'`).
      example: bcf49791f7f04f09bd46262097e107f2
    fields:
      type: object
      description: >-
        Field values keyed by field name; each value is a `field_list` of
        `{field_value, properties}` entries. `dehydrate_fields`
        (`v0_1.py:343-352`) always emits `field_value`, even though the
        write-side `FieldsDictField.hydrate` (`v0_1.py:253-265`) also accepts a
        bare `value` key on input.
      additionalProperties:
        type: object
        properties:
          field_list:
            type: array
            items:
              type: object
              properties:
                field_value:
                  type: string
                properties:
                  type: object
                  additionalProperties:
                    type: string
      example:
        name:
          field_list:
            - field_value: MMR
              properties:
                lang: en
        price:
          field_list:
            - field_value: "7"
              properties: {}
    sort_key:
      type: integer
      description: >-
        Row order as uploaded from Excel. Not shown in any user-facing UI; new
        rows created via the API get the next available sort key (`obj_create`,
        `v0_1.py:381-383`).
      example: 2
    item_attributes:
      type: object
      additionalProperties:
        type: string
      description: >-
        Free-form row-level attributes. Not shown in any `fixture.rst` sample
        output, but a genuine declared field (`v0_1.py:298`).
    resource_uri:
      type: string
      description: Always empty. Same mechanism as `Fixture.resource_uri`.
      example: ""
LookupTableItemList:
  allOf:
    - $ref: "./pagination.yaml#/PaginatedResponse"
    - type: object
      properties:
        objects:
          type: array
          items:
            $ref: "#/LookupTableItem"
LookupTableItemWrite:
  type: object
  description: >-
    Payload for creating or replacing a lookup table row. `data_type_id` is
    required on both create and replace (`obj_create`/`obj_update`,
    `v0_1.py:370-409`); on create, it must reference an existing lookup table or
    the request fails (see the discrepancy file for the surprising 404 shape
    this produces).
  required: [data_type_id]
  properties:
    data_type_id:
      type: string
      example: bcf49791f7f04f09bd46262097e107f2
    fields:
      type: object
      additionalProperties:
        type: object
        properties:
          field_list:
            type: array
            items:
              type: object
              properties:
                field_value:
                  type: string
                properties:
                  type: object
                  additionalProperties:
                    type: string
      example:
        name:
          field_list:
            - field_value: MMR
              properties:
                lang: en
        price:
          field_list:
            - field_value: "7"
              properties: {}
    item_attributes:
      type: object
      additionalProperties:
        type: string
