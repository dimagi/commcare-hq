# Messaging Events API (`docs/api/messaging-events.rst`). Served by
# `messaging_events` (`corehq/apps/api/resources/messaging_event/view.py`), a
# plain Django view over `MessagingSubEvent` -- not a tastypie resource, so
# there is no `Meta` to read for allowed methods or serialization. Every field
# below is traced to `serialize_event` and its helpers
# (`corehq/apps/api/resources/messaging_event/serializers.py`).
MessagingEventSource:
  type: object
  description: >-
    The trigger for the event, e.g. a broadcast or conditional alert
    (`_serialize_event_source`, `serializers.py:78-84`).
  properties:
    source_id:
      type: string
      description: ID of the source (e.g. the broadcast or keyword id).
      example: "4654"
    type:
      type: string
      description: >-
        Source type slug. One of `broadcast`, `scheduled-broadcast`,
        `immediate-broadcast`, `keyword`, `reminder`, `conditional-alert`,
        `forwarded-message`, `other`, or `unknown` if the underlying model value
        has no slug (`MessagingEvent.SOURCE_SLUGS`, `sms/models.py:1003-1013`).
      example: conditional-alert
    name:
      type: string
      description: >-
        Display name of the keyword, broadcast, etc. (`get_event_display_api`,
        `corehq/apps/reports/standard/message_event_display.py:297-312`).
      example: Email - Welcome Packet
MessagingEventRecipient:
  type: object
  description: >-
    The intended recipient of the event (`_serialize_event_recipient`,
    `serializers.py:66-75`).
  properties:
    recipient_id:
      type: string
      nullable: true
      description: Case ID or user ID. Null if the event has no recipient.
      example: 523132e0-a562-4be1-bbc8-a634423c5c0c
    type:
      type: string
      description: >-
        `case`, `mobile-worker`, `web-user`, or `unknown`
        (`MessagingSubEvent.RECIPIENT_SLUGS`, `sms/models.py:1648-1652`).
      example: case
    name:
      type: string
      description: >-
        Case or user name, or the literal string `unknown` if it could not be
        resolved or there is no recipient.
      example: Mary Little
MessagingEventForm:
  type: object
  nullable: true
  description: >-
    Present only when `content_type` is `sms-survey` or `ivr-survey`; null
    otherwise (`_serialize_event_form`, `serializers.py:96-105`).
  properties:
    app_id:
      type: string
      nullable: true
      example: 4d6a2b1e8f7c4a3e9b2d1c0f5a6b7c8d
    form_definition_id:
      type: string
      nullable: true
      description:
        Form unique ID (XMLNS-adjacent identifier), not the app build id.
      example: e1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6
    form_name:
      type: string
      nullable: true
      example: Welcome Survey
    form_submission_id:
      type: string
      nullable: true
      description: >-
        ID of the submitted XForm instance, only set once the survey session has
        produced a submission.
      example: 7f8e9d0c1b2a3948576645362718293a
MessagingEventError:
  type: object
  nullable: true
  description: >-
    Event-level error detail, present only when `error_code` is set on the
    underlying model; null otherwise (`_serialize_event_error`,
    `serializers.py:88-94`). Distinct from an individual message's own
    `error_message`.
  properties:
    code:
      type: string
      description: >-
        Error code slug, e.g. `NO_PHONE_NUMBER`, `NO_RECIPIENT`, `NO_MESSAGE`.
      example: NO_PHONE_NUMBER
    message:
      type: string
      nullable: true
      description: >-
        Display text for the error code (`MessagingEvent.ERROR_MESSAGES`), or
        null if the code is not recognized.
      example: Contact has no phone number.
    message_detail:
      type: string
      nullable: true
      description: Additional free-text detail about the error, if any.
      example: null
MessagingEventMessage:
  type: object
  description: >-
    One actual message sent or received as part of the event. The shape varies
    by `type` -- built by one of three helpers depending on the parent event's
    `content_type` (`_serialize_event_messages`, `serializers.py:47-56`):
    `_get_messages_for_email`, `_get_messages_for_sms`, or
    `_get_messages_for_survey`. `phone_number` is present only on `sms`/`ivr`
    messages, `email_address` only on `email` messages, and `error_message` is
    included only when the message actually errored (it is omitted from the dict
    entirely otherwise, not sent as `null`) -- see `_get_message_dicts_for_sms`,
    `serializers.py:127-149`.
  properties:
    message_id:
      type: integer
      description: >-
        Numeric ID of the underlying `SMS` or `Email` row (not the event id).
      example: 153444
    type:
      type: string
      description: "`sms`, `ivr`, or `email`."
      example: sms
    direction:
      type: string
      description: >-
        `outgoing`, `incoming`, or `unknown`. Always `outgoing` for `email`
        messages.
      example: outgoing
    content:
      type: string
      description: The actual message body that was sent or received.
      example: Welcome to CommCare
    date:
      type: string
      description: >-
        Message date. Naive (no UTC offset or `Z`) -- `USE_TZ = False`
        (`settings.py:57`). For `email` messages this is an explicit
        `.isoformat()` call (`serializers.py:118`) and keeps full microsecond
        precision, e.g. `2020-05-15T04:11:27.482899`. For `sms`/`ivr` messages
        the raw `datetime` is passed straight through (`serializers.py:141`,
        `"date": sms.date`) and serialized by `JsonResponse`'s default
        `DjangoJSONEncoder`, which truncates to millisecond precision, e.g.
        `2021-04-13T21:25:26.989` -- both forms are visible side by side in
        `messaging-events.rst`'s own sample response (`:154` vs `:163`).
        `format: date-time` is deliberately not declared since the value carries
        no timezone.
      example: "2021-04-13T21:25:26.989"
    date_modified:
      type: string
      nullable: true
      description: >-
        Date of the last modification to the message, or null if never modified.
        Same naive, no-`Z` format as `date`.
      example: null
    status:
      type: string
      description: >-
        Message status. For `email`: the parent event's status slug. For
        `sms`/`ivr`: one of `error`, `queued`, `received`, `forwarded`,
        `delivered`, `sent`, `unknown` (`get_sms_status_display_raw`,
        `corehq/apps/reports/standard/message_event_display.py:89-111`).
      example: sent
    backend:
      type: string
      description: >-
        Messaging backend/gateway name, e.g. `MOBILE_BACKEND_TWILIO`. Always the
        literal string `email` for `email` messages.
      example: MOBILE_BACKEND_TWILIO
    phone_number:
      type: string
      description:
        Recipient/sender phone number. Present only on `sms`/`ivr` messages.
      example: "+15555993494"
    email_address:
      type: string
      description: Recipient email address. Present only on `email` messages.
      example: patient@example.com
    error_message:
      type: string
      description: >-
        Human-readable error detail. Present only when the message actually
        errored -- omitted from the response entirely otherwise (not sent as
        `null`).
      example: Gateway error.
MessagingEvent:
  type: object
  description: >-
    A single messaging event and all of its constituent messages
    (`serialize_event`, `serializers.py:6-19`). Despite the resource's name this
    is backed by the `MessagingSubEvent` model, which has the more direct
    relationship to an individual recipient
    (`corehq/apps/api/resources/messaging_event/view.py:30-32`).
  properties:
    id:
      type: integer
      description: MessagingSubEvent numeric ID.
      example: 10215869
    content_type:
      type: string
      description: >-
        Content type slug, e.g. `sms`, `sms-survey`, `ivr-survey`, `email`,
        `manual-sms`, `api-sms`, `chat-sms`, or `unknown`
        (`MessagingEvent.CONTENT_TYPE_SLUGS`, `sms/models.py:1045-1059`).
      example: email
    date:
      type: string
      description: >-
        Event creation date. Naive (no `Z`/offset) -- an explicit `.isoformat()`
        call on a `USE_TZ = False` value (`serializers.py:10`), keeping full
        microsecond precision. `format: date-time` is deliberately not declared.
      example: "2020-05-15T04:11:27.482899"
    date_last_activity:
      type: string
      description: >-
        Date of the last message activity for this event. Useful for exports
        since `date` is the creation date. Same naive, no-`Z` format as `date`.
      example: "2020-05-15T04:11:27.482899"
    case_id:
      type: string
      nullable: true
      description: ID of the related case, if this event is related to one.
      example: 523132e0-a562-4be1-bbc8-a634423c5c0c
    domain:
      type: string
      description: >-
        The project space this event belongs to -- read from the parent
        `MessagingEvent.domain`, not the subevent's own `domain` field
        (`serializers.py:14`).
      example: ny-dev-cdcms
    error:
      $ref: "#/MessagingEventError"
    form:
      $ref: "#/MessagingEventForm"
    messages:
      type: array
      items:
        $ref: "#/MessagingEventMessage"
    recipient:
      $ref: "#/MessagingEventRecipient"
    source:
      $ref: "#/MessagingEventSource"
    status:
      type: string
      description: >-
        Event status. Usually one of `error`, `completed`, `in-progress`,
        `not-completed`, `unknown` (`MessagingEvent.STATUS_SLUGS`), but for a
        completed survey event this is instead the `XFormsSession` status slug,
        and a nominally `completed` event is reported as `error` if any of its
        messages errored (`_serialize_event_status`, `serializers.py:22-33`).
      example: completed
MessagingEventList:
  type: object
  description: >-
    List envelope for `listMessagingEvents`. Deliberately **not** built from
    `pagination.yaml#/PaginatedResponse`, whose `meta` is fixed to the
    offset-based `PaginationMeta` -- this is the only cursor-paginated resource
    in the spec, so `meta` references `CursorMeta` instead (`get_paged_data`,
    `corehq/apps/api/resources/messaging_event/pagination.py:14-22`).
  required: [meta, objects]
  properties:
    meta:
      $ref: "./pagination.yaml#/CursorMeta"
    objects:
      type: array
      items:
        $ref: "#/MessagingEvent"
