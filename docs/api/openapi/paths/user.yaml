List:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
  get:
    operationId: listMobileWorkers
    summary: List mobile workers
    description: >-
      Returns mobile (CommCare) workers in the project space. Requires the Edit
      Mobile Workers permission.
    tags: [Users]
    parameters:
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Offset"
      - $ref: "../components/parameters.yaml#/Format"
      - name: group
        in: query
        required: false
        description: >-
          Restrict results to members of this group UUID. A group id that does
          not exist, or belongs to a different domain, `obj_get_list`
          (`corehq/apps/api/resources/v0_1.py:126-136`) raises tastypie's
          `BadRequest` for -- returned as the shared `{"error": ...}` 400 shape.
        example: ac9d34ff59cf6388e4f5804b12276d8a
        schema:
          type: string
      - name: archived
        in: query
        required: false
        description: >-
          If truthy (case-insensitive `true`/`1`/`yes`; see `string_to_boolean`,
          `dimagi/utils/parsing.py`), list archived users instead of active
          ones. An unparsable value is treated as `false` (`_safe_bool`,
          `corehq/apps/api/resources/v0_1.py:174-178`).
        example: true
        schema:
          type: boolean
      - name: extras
        in: query
        required: false
        description: >-
          If truthy, adds a `extras` object with four Elasticsearch-backed
          activity counts to every returned user. May slow the request down.
        example: true
        schema:
          type: boolean
    responses:
      "200":
        description: A page of mobile workers.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yaml#/MobileWorkerList"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        # Deliberately not the shared ref: `RequirePermissionAuthentication
        # .is_authenticated` (`corehq/apps/api/resources/auth.py:152-163`)
        # delegates to `LoginAndDomainAuthentication._auth_test`
        # (`corehq/apps/api/resources/auth.py:114-135`), which catches the
        # `PermissionDenied` raised by a failed permission check
        # (`require_api_permission`/`require_permission_raw`,
        # `corehq/apps/users/decorators.py:34-54,74-110`) and returns a bare
        # `HttpResponseForbidden()` -- the response body is empty. The same
        # `PermissionDenied` can also come from the login-challenge decorator
        # itself (`corehq/apps/domain/decorators.py:281-306`) when the
        # authenticated user is not a member of this domain.
        description:
          The authenticated user lacks the Edit Mobile Workers permission, or is
          not a member of this project space. The response body is empty.
      "429":
        # Deliberately not the shared ref: tastypie's `throttle_check`
        # (tastypie/resources.py:574-592) returns a bare
        # `http.HttpTooManyRequests()` when `CustomResourceMeta.throttle`
        # (`HQThrottle.should_be_throttled`,
        # `corehq/apps/api/resources/meta.py:40-49`) reports throttling -- no
        # JSON body.
        description:
          The request was rate limited. Back off and retry. The response body is
          empty.
  post:
    operationId: createMobileWorker
    summary: Create a mobile worker
    description: >-
      Requires the Edit Mobile Workers and Edit Access APIs permissions.
      `obj_create` (`corehq/apps/api/resources/v0_5.py:270-340`) calls
      `self._update(bundle)` to apply the remaining fields but discards its
      return value -- unlike `updateMobileWorker`, a field-level update error
      during creation (for example an unrecognized `primary_location`) is
      silently swallowed rather than rejected with a 400. See the discrepancy
      file.
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/user.yaml#/MobileWorkerWrite"
          examples:
            standard:
              summary: Standard creation with a password
              value:
                username: jdoe
                password: qwer1234
                first_name: John
                last_name: Doe
                default_phone_number: "+50253311399"
                email: jdoe@example.org
                language: en
                phone_numbers: ["+50253311399", "50253314588"]
                groups:
                  - 9a0accdba29e01a61ea099394737c4fb
                  - b4ccdba29e01a61ea099394737c4fbf7
                primary_location: 26fc44e2792b4f2fa8ef86178f0a958e
                locations:
                  - 26fc44e2792b4f2fa8ef86178f0a958e
                  - c1b029932ed442a6a846a4ea10e46a78
                user_data:
                  chw_id: "13/43/DFA"
            unconfirmed:
              summary: Two-stage account confirmation, no password
              value:
                username: jdoe
                first_name: John
                last_name: Doe
                email: jdoe@example.org
                primary_location: 26fc44e2792b4f2fa8ef86178f0a958e
                locations:
                  - 26fc44e2792b4f2fa8ef86178f0a958e
                  - c1b029932ed442a6a846a4ea10e46a78
                require_account_confirmation: true
                send_confirmation_email_now: true
                user_data:
                  chw_id: "13/43/DFA"
    responses:
      "201":
        description: >-
          The mobile worker was created. Unlike `createGroup`, this endpoint
          returns the full object (`always_return_data = True`, no `serialize`
          override), not just an `id` -- `mobile-worker.rst`'s "Output
          Parameters" table (listing only `id`) undersells the real response.
          See the discrepancy file.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yaml#/MobileWorker"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        description:
          The authenticated user lacks the Edit Mobile Workers permission, or is
          not a member of this project space. The response body is empty.
      "429":
        description:
          The request was rate limited. Back off and retry. The response body is
          empty.
Detail:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
    - name: user_id
      in: path
      required: true
      description: Mobile worker UUID.
      example: 3c5a623af057e23a32ae4000cf291339
      schema:
        type: string
  get:
    operationId: getMobileWorker
    summary: Retrieve a single mobile worker
    tags: [Users]
    responses:
      "200":
        description: The mobile worker.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yaml#/MobileWorker"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "400":
        # Deliberately not a 404. `UserResource.obj_get`
        # (`corehq/apps/api/resources/v0_1.py:36-43`) returns `None` on a miss
        # or a domain mismatch (`CouchUser.get_by_user_id`,
        # `corehq/apps/users/models.py:1529-1544`, itself never raises -- it
        # returns `None`). Tastypie's `get_detail`
        # (`tastypie/resources.py:1362-1383`) only converts
        # `ObjectDoesNotExist`/`MultipleObjectsReturned` to a 404, so the bare
        # `None` is passed straight into `full_dehydrate`. There,
        # `ApiField.dehydrate` (`tastypie/fields.py:116-136`) does
        # `getattr(None, attr, None)`, sees the result is `None`, and --
        # because `id`/`username`/`email` are declared without `null=True`
        # or a default (`v0_1.py:27-32`) -- raises `tastypie.fields
        # .ApiFieldError`. `wrap_view` catches `ApiFieldError` *explicitly*,
        # before the generic `except Exception` -> `_handle_500` path
        # (`tastypie/resources.py:244-246`), and converts it to a 400 with
        # the shared `{"error": ...}` shape. See the discrepancy file (this
        # corrects an earlier, wrong "500" claim).
        description:
          The mobile worker does not exist, or belongs to a different project
          space.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/error.yaml#/Error"
      "403":
        description:
          The authenticated user lacks the Edit Mobile Workers permission, or is
          not a member of this project space. The response body is empty.
      "429":
        description:
          The request was rate limited. Back off and retry. The response body is
          empty.
  put:
    operationId: updateMobileWorker
    summary: Update a mobile worker
    description: >-
      Requires the Edit Mobile Workers and Edit Access APIs permissions. Fields
      not included in the request body are left unchanged, except where noted on
      `MobileWorkerWrite` (`phone_numbers`, `groups`, and `user_data` are
      wholesale replacements, not merges).
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/user.yaml#/MobileWorkerWrite"
          examples:
            update:
              value:
                first_name: John
                last_name: Doe
                email: jdoe@example.org
                language: en
                password: new password
                phone_numbers: ["+50253311399", "50253314588"]
                groups:
                  - 9a0accdba29e01a61ea099394737c4fb
                  - b4ccdba29e01a61ea099394737c4fbf7
                primary_location: 26fc44e2792b4f2fa8ef86178f0a958e
                locations:
                  - 26fc44e2792b4f2fa8ef86178f0a958e
                  - c1b029932ed442a6a846a4ea10e46a78
                send_confirmation_email_now: true
                user_data:
                  chw_id: "13/43/DFA"
    responses:
      "200":
        description: >-
          The updated mobile worker. Returned with plain status 200: tastypie's
          `put_detail` (`tastypie/resources.py:1493-1501`) calls
          `create_response` without a `response_class` when `always_return_data
          = True`, defaulting to 200 -- contrast `updateWebUser`'s PATCH, which
          the framework explicitly forces to 202.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yaml#/MobileWorker"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        description:
          The authenticated user lacks the Edit Mobile Workers permission, or is
          not a member of this project space. The response body is empty.
      # No 404 here -- deliberately omitted, for the same reason as
      # `replaceGroup` in `paths/group.yaml`. `obj_update`
      # (`corehq/apps/api/resources/v0_5.py:351-353`) fetches the user with
      # `CommCareUser.get(kwargs['pk'])`, couchdbkit's plain `.get()`, which
      # raises `ResourceNotFound` on a miss -- neither tastypie's `NotFound`
      # nor Django's `ObjectDoesNotExist`, so `put_detail`'s
      # `except (NotFound, MultipleObjectsReturned)` never catches it, and it
      # becomes an uncaught 500. A user that exists but belongs to a
      # different domain fails the very next line's bare
      # `assert bundle.obj.domain == kwargs['domain']`, also an uncaught
      # 500 (a plain `AssertionError` is not a 400). See the discrepancy file.
      "429":
        description:
          The request was rate limited. Back off and retry. The response body is
          empty.
  delete:
    operationId: deleteMobileWorker
    summary: Delete (retire) a mobile worker
    description: >-
      Requires the Edit Mobile Workers and Edit Access APIs permissions.
    tags: [Users]
    responses:
      "202":
        description: >-
          The mobile worker was retired. `obj_delete`
          (`corehq/apps/api/resources/v0_5.py:375-382`) returns
          `ImmediateHttpResponse(response=http.HttpAccepted())` directly, so
          this is 202, not the 204 tastypie's default `delete_detail` would
          otherwise return.
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        description:
          The authenticated user lacks the Edit Mobile Workers permission, or is
          not a member of this project space. The response body is empty.
      "404":
        # Deliberately not the shared NotFound ref: `obj_delete`
        # (`corehq/apps/api/resources/v0_5.py:375-381`) raises tastypie's own
        # `NotFound(...)` when `CommCareUser.get_by_user_id` returns `None`
        # (missing id, or a user that belongs to a different domain).
        # `delete_detail` (`tastypie/resources.py:1525-1541`) catches
        # tastypie's `NotFound` directly and returns a bare
        # `http.HttpNotFound()` -- the response body is empty. This is the
        # one detail operation on this resource whose 404 actually works as
        # a 404.
        description:
          The mobile worker does not exist, or belongs to a different project
          space. The response body is empty.
      "429":
        description:
          The request was rate limited. Back off and retry. The response body is
          empty.
PasswordReset:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
    - name: user_id
      in: path
      required: true
      description: Mobile worker UUID.
      example: 3c5a623af057e23a32ae4000cf291339
      schema:
        type: string
  post:
    operationId: sendMobileWorkerPasswordReset
    summary: Send a password reset email to a mobile worker
    description: >-
      Served by a custom `prepend_urls` view, not tastypie's normal detail
      dispatch (`CommCareUserResource.email_password_reset`,
      `corehq/apps/api/resources/v0_5.py:412-447`). Requires the Edit Mobile
      Workers and Edit Access APIs permissions.
    tags: [Users]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
    responses:
      "202":
        description: The reset email was sent. The response body is empty.
      "400":
        description: >-
          The user has no email address, has no usable password, or is inactive
          (`email_password_reset`, `corehq/apps/api/resources/v0_5.py:438-443`).
          Uses the shared `{"error": ...}` shape (tastypie's `BadRequest`,
          converted by `wrap_view`).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/error.yaml#/Error"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        description:
          The authenticated user lacks the Edit Mobile Workers permission, or is
          not a member of this project space. The response body is empty.
      "404":
        # Deliberately not the shared NotFound ref: raises tastypie's own bare
        # `NotFound()` (`v0_5.py:435`) with no message. Because this is a
        # custom `prepend_urls` view, not `get_detail`/`delete_detail`, it is
        # not caught by any resource-specific 404 handling -- it falls to
        # `wrap_view`'s generic `except Exception` -> `_handle_500`
        # (`tastypie/resources.py:250-265,291-315`), which recognizes
        # tastypie's `NotFound` and maps it to a 404 status, but always builds
        # a generic canned `error_message` body, never the (empty, here)
        # exception text.
        description: The mobile worker does not exist.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yaml#/UserErrorMessage"
      "429":
        description:
          The request was rate limited. Back off and retry. The response body is
          empty.
Activate:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
    - name: user_id
      in: path
      required: true
      description: Mobile worker UUID.
      example: 3c5a623af057e23a32ae4000cf291339
      schema:
        type: string
  post:
    operationId: activateMobileWorker
    summary: Reactivate a mobile worker
    description: >-
      Undocumented in `mobile-worker.rst`, but real and tested
      (`corehq/apps/api/tests/test_user_resources.py:582-596`). Served by a
      custom `prepend_urls` view
      (`CommCareUserResource.activate_user`/`_modify_user_status`,
      `corehq/apps/api/resources/v0_5.py:412-414,420-422,449-470`). See the
      discrepancy file.
    tags: [Users]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
    responses:
      "202":
        description: >-
          The user was activated. The response body is the JSON literal `{}`
          (`create_response(request, {}, response_class=http.HttpAccepted)`,
          `v0_5.py:470`).
      "400":
        description: >-
          The activation was rejected by `verify_modify_user_conditions`
          (`corehq/apps/api/resources/v0_5.py:458-461`) -- for example, a
          location-restricted user being activated/deactivated by someone
          without the right location access. Uses the shared `{"error": ...}`
          shape.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/error.yaml#/Error"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        description:
          The authenticated user lacks the Edit Mobile Workers permission, or is
          not a member of this project space. The response body is empty.
      "404":
        # Same shape and mechanism as sendMobileWorkerPasswordReset's 404 --
        # a bare `NotFound()` (`v0_5.py:456`) reaching `_handle_500`.
        description: The mobile worker does not exist.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yaml#/UserErrorMessage"
      "429":
        description:
          The request was rate limited. Back off and retry. The response body is
          empty.
Deactivate:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
    - name: user_id
      in: path
      required: true
      description: Mobile worker UUID.
      example: 3c5a623af057e23a32ae4000cf291339
      schema:
        type: string
  post:
    operationId: deactivateMobileWorker
    summary: Deactivate a mobile worker
    description: >-
      Undocumented in `mobile-worker.rst`, but real and tested
      (`corehq/apps/api/tests/test_user_resources.py:598-616`). Served by a
      custom `prepend_urls` view
      (`CommCareUserResource.deactivate_user`/`_modify_user_status`,
      `corehq/apps/api/resources/v0_5.py:412-415,424-426,449-470`). See the
      discrepancy file.
    tags: [Users]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
    responses:
      "202":
        description: >-
          The user was deactivated. The response body is the JSON literal `{}`.
      "400":
        description: >-
          The deactivation was rejected by `verify_modify_user_conditions` (for
          example, a location-restricted user). Uses the shared `{"error": ...}`
          shape.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/error.yaml#/Error"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        description:
          The authenticated user lacks the Edit Mobile Workers permission, or is
          not a member of this project space. The response body is empty.
      "404":
        description: The mobile worker does not exist.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yaml#/UserErrorMessage"
      "429":
        description:
          The request was rate limited. Back off and retry. The response body is
          empty.
