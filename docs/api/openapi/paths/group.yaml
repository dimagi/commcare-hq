List:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
  get:
    operationId: listGroups
    summary: List user groups
    description: >-
      Returns groups the authenticated user is permitted to see. Requires the
      Edit Mobile Workers permission.
    tags: [Users]
    parameters:
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Offset"
      - $ref: "../components/parameters.yaml#/Format"
    responses:
      "200":
        description: A page of groups.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/group.yaml#/GroupList"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"
  post:
    operationId: createGroup
    summary: Create a user group
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/group.yaml#/GroupWrite"
    responses:
      "201":
        description: >-
          The group was created. Note that this endpoint returns only the new
          group's id, not the full group object -- fetch the detail endpoint if
          you need the rest.
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: UUID of the newly created group.
                  example: 1eb59d6938fc7e510254d8c2f63d944f
      "400":
        description: The request payload was invalid.
        content:
          application/json:
            schema:
              type: object
              properties:
                error_message:
                  type: string
                  description: >-
                    Validation failure detail. Note this endpoint uses
                    `error_message`, not the `error` key used elsewhere.
                  example: "Group name is required"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
  patch:
    operationId: bulkUpdateGroups
    summary: Bulk create or update groups
    description: >-
      Accepts a list of group payloads. Declared by
      `v0_5.GroupResource.patch_list`.
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              objects:
                type: array
                items:
                  $ref: "../components/schemas/group.yaml#/GroupWrite"
    responses:
      "202":
        description: >-
          All groups were created or updated. The body is an array of the new
          group ids, in the same order as the submitted `objects`.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                description: UUID of a created or updated group.
              example:
                - 1eb59d6938fc7e510254d8c2f63d944f
      "400":
        description: >-
          At least one group in the batch failed. The body is an array the same
          length and order as the submitted `objects`: each element is either
          the new group's id (that object succeeded) or the raw validation error
          text (that object failed) -- not an `error`/`error_message` object,
          and there is no separate flag indicating which elements are which. A
          client must shape-guess (for example, checking whether an element
          looks like a group UUID) to tell success from failure.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              example:
                - 1eb59d6938fc7e510254d8c2f63d944f
                - Name is required
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
Detail:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
    - name: group_id
      in: path
      required: true
      description: Group UUID.
      example: 1eb59d6938fc7e510254d8c2f63d944f
      schema:
        type: string
  get:
    operationId: getGroup
    summary: Retrieve a single user group
    tags: [Users]
    responses:
      "200":
        description: The group.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/group.yaml#/Group"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
  put:
    operationId: replaceGroup
    summary: Replace a user group
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/group.yaml#/GroupWrite"
    responses:
      "200":
        description: The updated group.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/group.yaml#/Group"
      "400":
        description: The request payload was invalid.
        content:
          application/json:
            schema:
              type: object
              properties:
                error_message:
                  type: string
                  description: >-
                    Validation failure detail. Note this endpoint uses
                    `error_message`, not the `error` key used elsewhere.
                  example: "A group with name Wozzle already exists"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
  delete:
    operationId: deleteGroup
    summary: Delete a user group
    tags: [Users]
    responses:
      "204":
        description: The group was deleted.
      "404":
        $ref: "../components/responses.yaml#/NotFound"
