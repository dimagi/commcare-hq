List:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
  get:
    operationId: listGroups
    summary: List user groups
    description: >-
      Returns groups the authenticated user is permitted to see. Requires the
      Edit Mobile Workers permission.
    tags: [Users]
    parameters:
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Offset"
      - $ref: "../components/parameters.yaml#/Format"
    responses:
      "200":
        description: A page of groups.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/group.yaml#/GroupList"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"
  post:
    operationId: createGroup
    summary: Create a user group
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/group.yaml#/GroupWrite"
    responses:
      "201":
        description: >-
          The group was created. Note that this endpoint returns only the new
          group's id, not the full group object -- fetch the detail endpoint if
          you need the rest.
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: UUID of the newly created group.
                  example: 1eb59d6938fc7e510254d8c2f63d944f
      "400":
        description: >-
          The request payload was invalid. Note this endpoint's error body uses
          `error_message`, not the `error` key used elsewhere.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/group.yaml#/GroupErrorMessage"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"
  patch:
    operationId: bulkUpdateGroups
    summary: Bulk create or update groups
    description: >-
      Accepts a list of group payloads. Declared by
      `v0_5.GroupResource.patch_list`.
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              objects:
                type: array
                items:
                  $ref: "../components/schemas/group.yaml#/GroupWrite"
    responses:
      "202":
        description: >-
          All groups were created or updated. The body is an array of the new
          group ids, in the same order as the submitted `objects`.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                description: UUID of a created or updated group.
              example:
                - 1eb59d6938fc7e510254d8c2f63d944f
      "400":
        description: >-
          At least one group in the batch failed. The body is an array the same
          length and order as the submitted `objects`: each element is either
          the new group's id (that object succeeded) or the raw validation error
          text (that object failed) -- not an `error`/`error_message` object,
          and there is no separate flag indicating which elements are which. A
          client must shape-guess (for example, checking whether an element
          looks like a group UUID) to tell success from failure.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              example:
                - 1eb59d6938fc7e510254d8c2f63d944f
                - Name is required
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"
Detail:
  parameters:
    - $ref: "../components/parameters.yaml#/Domain"
    - name: group_id
      in: path
      required: true
      description: Group UUID.
      example: 1eb59d6938fc7e510254d8c2f63d944f
      schema:
        type: string
  get:
    operationId: getGroup
    summary: Retrieve a single user group
    tags: [Users]
    responses:
      "200":
        description: The group.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/group.yaml#/Group"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        # Deliberately not the shared NotFound ref: tastypie's get_detail
        # (tastypie/resources.py:1362-1383) catches ObjectDoesNotExist and
        # returns a bare `http.HttpNotFound()` -- a plain HttpResponse with
        # no content set, not something built through the serializer. The
        # real response body is empty. See the discrepancy file.
        description:
          The requested group does not exist. The response body is empty.
      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"
  put:
    operationId: replaceGroup
    summary: Replace a user group
    # No 404 here -- this is a deliberate exception to the "404 on every
    # detail operation" convention, not an oversight. `obj_update`
    # (v0_5.py:762-763) fetches the group with `Group.get(pk)`, which raises
    # couchdbkit's `ResourceNotFound`. That exception is neither tastypie's
    # `NotFound` (the only thing `put_detail` catches) nor Django's
    # `ObjectDoesNotExist`, so it is never converted to a 404 -- it propagates
    # to a generic 500. Documenting a 404 the code cannot return would
    # mislead clients; see the discrepancy file for the underlying bug.
    tags: [Users]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/group.yaml#/GroupWrite"
    responses:
      "200":
        description: The updated group.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/group.yaml#/Group"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"
  delete:
    operationId: deleteGroup
    summary: Delete a user group
    tags: [Users]
    responses:
      "204":
        description: The group was deleted.
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        # Deliberately not the shared NotFound ref. `delete_detail`
        # (tastypie/resources.py:1525-1541) only catches tastypie's own
        # `NotFound`, but `obj_delete` -> `obj_get` raises Django's
        # `ObjectDoesNotExist` (via get_object_or_not_exist), which isn't
        # caught there. It propagates to wrap_view's generic exception
        # handler (_handle_500), which maps ObjectDoesNotExist to a 404
        # status but builds the body from its own canned-error path -- keyed
        # `error_message`, not `error`, and not resource-specific. See the
        # discrepancy file.
        description: >-
          The requested group does not exist. Reached via tastypie's generic
          exception handler rather than a resource-specific not-found path.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/group.yaml#/GroupErrorMessage"
      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"
