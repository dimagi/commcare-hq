        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authenticated user lacks API access, or is not a member of this project space. The response body is empty. Same mechanism as `listLookupTables`'s 403.
        '404':
          description: Neither `lookup_table_item_id` nor the fallback-create's `data_type_id` reference an existing row/lookup table. See this operation's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableErrorMessage'
        '429':
          description: The request was rate limited. Back off and retry. The response body is empty. Same mechanism as `listLookupTables`'s 429.
    delete:
      operationId: deleteLookupTableItem
      summary: Delete a lookup table row
      description: '**Returns 202 Accepted, not 204.** Same mechanism as `deleteLookupTable`: `obj_delete` (`v0_1.py:360-368`) raises `ImmediateHttpResponse(response=HttpAccepted())` on success.'
      tags:
