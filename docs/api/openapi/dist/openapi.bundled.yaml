          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Location ID of a created or updated location.
                example:
                  - eea759ae08044807be749f665a1fd39a
        '400':
          description: 'Either the batch exceeded the 100-object limit, or a single item failed validation -- the whole batch is rolled back either way. The body is a single `{"error": ...}` object, not an array (see the operation description).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authenticated user lacks the Edit Locations permission, or the domain lacks the Locations privilege. The response body is empty.
        '429':
          $ref: '#/components/responses/TooManyRequests'
