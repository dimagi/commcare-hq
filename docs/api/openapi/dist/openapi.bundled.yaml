  /a/{domain}/receiver/api/:
    parameters:
      - $ref: '#/components/parameters/Domain'
      - name: X-OpenRosa-Version
        in: header
        required: false
        description: 'Selects the OpenRosa response contract. `SubmissionPost.__init__` (`corehq/form_processor/submission_post.py:102`) treats the header as version 3.0 behavior only when it is exactly `"3.0"` (`is_openrosa_version3`); any other value, or its absence, falls back to version 2.0 behavior (`_get_open_rosa_response`, `corehq/form_processor/submission_post.py:572-585`). Every HTTP response from CommCare HQ (not just submission responses) also carries an outbound version header, always the fixed value `1.0` (`OPENROSA_DEFAULT_VERSION`, `corehq/const.py:20`, applied by `OpenRosaMiddleware.process_response`, `corehq/middleware.py:55-57`) -- it does not echo this request header or reflect which response contract was actually used. That outbound header''s literal name is also not the standard `X-OpenRosa-Version`: `process_response` does `response[OPENROSA_VERSION_HEADER] = OPENROSA_DEFAULT_VERSION` (`corehq/middleware.py:56`) where `OPENROSA_VERSION_HEADER = "HTTP_X_OPENROSA_VERSION"` (`corehq/middleware.py:35`) -- the WSGI `META` key, used verbatim as the response header name instead of being translated to `X-OpenRosa-Version`. Django sends whatever string is used as the response mapping key, so the actual outbound header is named `HTTP_X_OPENROSA_VERSION`. A second reference deletes the same literal key (`del response[''HTTP_X_OPENROSA_VERSION'']`, `corehq/middleware.py:258`). See the discrepancy file.'
        example: '3.0'
        schema:
          type: string
          enum:
            - '2.0'
            - '3.0'
    post:
      operationId: submitForm
      summary: Submit an XForm
      description: Implements the OpenRosa Form Submission API (https://bitbucket.org/javarosa/javarosa/wiki/FormSubmissionAPI) for submitting XForms over HTTP/S. Requires the Edit Data and Access APIs permissions (`post_api`, `corehq/apps/receiverwrapper/views.py:278-294`, decorated with `@require_permission(HqPermissions.edit_data)` and `@require_permission(HqPermissions.access_api)`). This endpoint's body is treated as opaque, application-defined XForm XML -- see `form-submission.rst` for the expected `data`/`meta`/`case` structure; it is not modelled as a schema here.
      tags:
        - Submission
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - xml_submission_file
              properties:
                xml_submission_file:
                  type: string
                  format: binary
                  description: The XForm submission XML as a file part. Used by CommCare for J2ME (`form-submission.rst:17-35`).
            examples:
              multipartSubmission:
                summary: Submission as multipart/form-data
                value:
                  xml_submission_file: (binary XForm XML content)
          application/xml:
            schema:
              type: string
              description: The raw XForm submission XML as the entire request body. Used by CommCare on Android (`form-submission.rst:37-46`).
            examples:
              rawSubmission:
                summary: Submission as the body of a POST request
                value: |
                  <?xml version="1.0" ?>
                  <data name="Enregistrer un cas COVID-19" uiVersion="1" version="41"
                        xmlns="http://openrosa.org/formdesigner/9baceb4c25a5">
                    <n1:meta xmlns:n1="http://openrosa.org/jr/xforms">
                      <n1:deviceID>commcare_37478fd5-2730-4a14-a847-84e8848a1ff5</n1:deviceID>
                      <n1:timeStart>2020-06-08T18:38:13.855Z</n1:timeStart>
                      <n1:timeEnd>2020-06-08T18:41:33.207Z</n1:timeEnd>
                      <n1:username>exampleuser</n1:username>
                      <n1:userID>de8cc5191f9b4e2a846069f0659fa35e</n1:userID>
                      <n1:instanceID>dca03509-4446-41dc-8352-2bb6f8516c7b</n1:instanceID>
                    </n1:meta>
                  </data>
      responses:
        '201':
          description: 'Form was received. The `nature` attribute distinguishes success (`submit_success`) from processing failure under OpenRosa V2.0 behavior (`submit_error`, still HTTP 201) -- `form-submission.rst:265-313`. The actual `Content-Type` header is `text/html; charset=utf-8`, not `text/xml`: none of the code paths that build this response (`couchforms.openrosa_response.OpenRosaResponse.response`, `corehq/ex-submodules/couchforms/openrosa_response.py:58-59`) pass a `content_type` to Django''s `HttpResponse`, so Django''s default applies (`settings.DEFAULT_CONTENT_TYPE`, unset in this codebase). The body itself is genuinely OpenRosa XML despite the header; this mismatch is a real interoperability bug in the endpoint, not a documentation choice -- see the discrepancy file.'
          content:
            text/html:
              schema:
                type: string
                description: 'Despite the `text/html` `Content-Type`, the body is OpenRosa response XML: `<OpenRosaResponse xmlns="http://openrosa.org/http/response"> <message nature="...">...</message></OpenRosaResponse>`. See https://bitbucket.org/javarosa/javarosa/wiki/FormSubmissionAPI.'
              examples:
                submitSuccess:
                  summary: Example success response
                  value: <OpenRosaResponse xmlns="http://openrosa.org/http/response"><message nature="submit_success">   &#8730; </message></OpenRosaResponse>
        '400':
          description: The submission could not be parsed (e.g. corrupt multipart data or another malformed request) -- `_submission_error` (`corehq/apps/receiverwrapper/views.py:228-250`). Plain text body, not the OpenRosa XML envelope.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Authentication credentials were missing or invalid.
        '403':
          description: The authenticated user lacks the Edit Data or Access APIs permission. The response is an HTML page, not JSON.
        '422':
          description: 'Form received but an error occurred during processing (OpenRosa V3.0 behavior, selected via the `X-OpenRosa-Version: 3.0` request header). Re-submission is likely to result in the same error; mobile clients quarantine the form (`form-submission.rst:317-341`). Same `text/html`-vs-XML-body `Content-Type` caveat as the 201 response.'
          content:
            text/html:
              schema:
                type: string
        '429':
          description: The request was rate limited. Back off and retry. The response body is empty.
