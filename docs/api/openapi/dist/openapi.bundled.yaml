    put:
      operationId: replaceLookupTable
      summary: Replace a lookup table
      description: |-
        The submitted `tag` must equal the existing table's `tag` exactly -- `obj_update` (`v0_1.py:205-218`) raises a 400 if it differs (`"Lookup table tag cannot be changed"`), a constraint `fixture.rst` never states.
        **No 404 is reachable here, by design of the fallback tastypie already provides -- but it silently creates an unrelated new table instead of signalling a problem.** `obj_update` raises tastypie's `NotFound` for an unknown `lookup_table_id` (`v0_1.py:210-215`); `put_detail` (`tastypie/resources.py:1467-1511`) catches exactly that exception and falls back to `obj_create` with the *same submitted body*. Since `obj_create` (`v0_1.py:193-203`) ignores the URL's `pk` entirely and only checks whether the submitted `tag` is already taken, a `PUT` to a nonexistent `lookup_table_id` with a fresh `tag` **creates a brand-new lookup table under a different, server-generated id** and returns 201, not 404. This is the same tastypie fallback mechanism documented for `replaceGroup`, but unlike that case, it does not fall through to an uncaught 500 here -- it actually succeeds, just not at the id the caller asked for. See the discrepancy file.
