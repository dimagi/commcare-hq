      description: Identical submission mechanics to `submitForm`, tagging the resulting form with `app_id` so reporting can attribute it to a specific application (`post`, `corehq/apps/receiverwrapper/views.py:297-320`). Unlike `submitForm`, this endpoint does not require the Edit Data or Access APIs permissions in code -- if the domain has secure submissions enabled (`domain_requires_auth`, `corehq/apps/receiverwrapper/views.py:306-309`), the request is delegated to `secure_post`, which requires one of digest, basic, API-key, or OAuth2 authentication (`corehq/apps/receiverwrapper/views.py:391-450`) but no specific permission beyond a valid mobile worker or web user login; if the domain does not require auth, the form is processed unauthenticated (`authenticated=False`, `corehq/apps/receiverwrapper/views.py:314-320`). Most production domains have secure submissions enabled, so this endpoint behaves as authenticated in practice; see the discrepancy file.
