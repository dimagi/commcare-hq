          description: The authenticated user lacks the Edit Apps permission. The response is an HTML error page, not JSON. Same mechanism as `importApplication`'s 403.
        '404':
          description: The application does not exist in this domain (`ResourceNotFound`, caught at `app_import_api.py:93-98`). Real JSON body, not empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAppError'
        '429':
          description: The request was rate limited. Back off and retry. The response body is empty. Same mechanism as `importApplication`'s 429.
  /a/{domain}/apps/api/{app_id}/multimedia/status/{processing_id}/:
    parameters:
      - $ref: '#/components/parameters/Domain'
      - name: app_id
        in: path
        required: true
        description: Application UUID.
        example: 6c9c5c1c1b8e4b6e9e6f6b6e9e6f6b6e
        schema:
          type: string
      - name: processing_id
        in: path
        required: true
        description: Opaque id returned by `uploadApplicationMultimedia`.
        example: dl-abc123def456
        schema:
          type: string
    get:
      operationId: getMultimediaUploadStatus
      summary: Poll the status of a queued multimedia upload
      description: |-
        Polls the background job started by `uploadApplicationMultimedia` (`multimedia_status_api`/`_handle_multimedia_status`, `app_import_api.py:134-163`). Requires the Edit Apps permission, same mechanism as `importApplication`.
        Unlike several other status-polling endpoints in this API (compare `getFixtureUploadStatus`), **this one has genuine 404 and 500 responses with real JSON bodies**, not an always-200 contract.
      tags:
        - Data
      responses:
        '200':
          description: Current status. See `MultimediaUploadStatus`'s description for why this is a single shape, not the two the task brief and `import-app.rst` describe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultimediaUploadStatus'
        '401':
          description: Authentication credentials were missing or invalid. The response body is empty or plain text, not JSON. Same mechanism as `importApplication`'s 401.
        '403':
          description: The authenticated user lacks the Edit Apps permission. The response is an HTML error page, not JSON. Same mechanism as `importApplication`'s 403.
        '404':
          description: The application does not exist in this domain (`ResourceNotFound`, `app_import_api.py:140-144`), or the `processing_id` is not found or has expired from cache (`BulkMultimediaStatusCache.get` returning `None`, `app_import_api.py:154-159`). Both cases share this body shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAppError'
        '429':
          description: The request was rate limited. Back off and retry. The response body is empty. Same mechanism as `importApplication`'s 429.
        '500':
          description: The queued Celery task failed (`get_download_context` raising `TaskFailedError`, `soil/util.py:73-91`, caught at `app_import_api.py:146-152`). This is a real, code-verified path, reachable only when a Celery worker actually processes and fails the task -- not exercised by the offline checks in this task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAppError'
  /a/{domain}/importer/excel/bulk_upload_api/:
    parameters:
      - $ref: '#/components/parameters/Domain'
    post:
      operationId: bulkUploadCases
      summary: Bulk-create or update cases from an Excel file
      description: |-
        Uploads an Excel file of case data to create or update cases, via the same importer used by the Excel Case Data Importer UI (`bulk_case_upload_api`/`_bulk_case_upload_api`, `corehq/apps/case_importer/views.py:461-550`). Uploads are subject to the same restrictions as the UI importer but with much more limited feedback (`bulk-upload-cases.rst:83-85`); test uploads there first. Requires the Edit Data permission (`require_can_edit_data = require_permission(HqPermissions.edit_data)`, `case_importer/views.py:72`, applied at `:467`).
        A success `code` means the upload was *processed*, not that every row imported without error -- business-level failures (e.g. an invalid location) surface later, via the `status_url`, whose own response shape is out of scope for this spec.
      tags:
        - Data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - case_type
              properties:
                file:
                  type: string
                  format: binary
                  description: The `.xlsx`/`.xls` file containing case data. Its internal structure is not modeled here.
                case_type:
                  type: string
                  description: The case type to assign to created cases.
                  example: household
                search_field:
                  type: string
                  description: Whether to match existing cases against CommCare HQ's internal `case_id` or an external `external_id` (`_bulk_case_upload_api`, `views.py:495-503`). Any other value is rejected with a 500 (see the `500` response).
                  enum:
                    - case_id
                    - external_id
                  default: case_id
                  example: external_id
                search_column:
                  type: string
                  description: The spreadsheet column to match against `search_field`. Defaults to `case_id` or `external_id` matching `search_field`.
                  example: household_id
                create_new_cases:
                  type: string
                  description: '`"on"` to create new cases when no existing case matches `search_field` -- compared literally against the string `"on"` (`views.py:496`); any other value (including omission) means false.'
                  example: 'on'
                name_column:
                  type: string
                  description: The spreadsheet column to interpret as the case name.
                  example: household_name
      responses:
        '200':
          description: The upload was processed (successfully or not -- see `code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadCasesResponse'
        '401':
          description: Authentication credentials were missing or invalid. The response body is empty or plain text, not JSON.
        '403':
          description: The authenticated user lacks the Edit Data permission. The response is an HTML error page, not JSON.
        '500':
          description: A caught `ImporterError` (e.g. missing `file`/`case_type`, an invalid `search_field` value, or a bulk-import config error), `SpreadsheetFileExtError` (wrong file extension), or `SpreadsheetFileInvalidError` (unreadable spreadsheet) (`bulk_case_upload_api`, `views.py:470-482`). **The HTTP transport status genuinely is 500 here** (`json_response(..., status_code=500)`), unlike several other upload endpoints in this API where the body's `code` diverges from the real transport status. Any other exception type is not caught and produces Django's own unhandled-error response instead (HTML, not this shape) -- see the discrepancy file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadCasesResponse'
  /a/{domain}/api/messaging-event/v1/:
    parameters:
      - $ref: '#/components/parameters/Domain'
    get:
      operationId: listMessagingEvents
      summary: List messaging events
      description: |-
        Returns a cursor-paginated page of messaging events (technically `MessagingSubEvent` rows -- see the schema description) for the domain. Requires the Edit Data permission and API access (`@require_can_edit_data`, `@requires_privilege_with_fallback`, `view.py:26-27`).

        **Pagination is cursor-based, not offset-based.** There is no `offset` parameter; follow `meta.next` until it is null. Results are always ordered by `date_last_activity` then `id` (`sort_query`, `corehq/apps/api/resources/messaging_event/utils.py:27-32`) unless `order_by` requests descending order.

        **Filters are combined with AND.** Every parameter below except `limit` and `cursor` narrows the result set further when combined with another.
      tags:
        - SMS
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          required: false
          description: 'Opaque pagination token. **Always copy this verbatim from a previous response''s `meta.next` URL -- never construct or edit it yourself.** When present, every other query parameter on the request is ignored: the cursor itself re-encodes the original filters plus the id of the last object already seen (`get_request_params`, `corehq/apps/api/resources/messaging_event/utils.py:55-63`, and `_get_cursor`, `.../pagination.py:49-70`).'
          example: ZGF0ZS5ndGU9MjAyMC0wNS0xN1QyMCUzQTM3JTNBMTEuNzU3OTQwJmxhc3Rfb2JqZWN0X2lkPTEwMjUwOTYw
          schema:
            type: string
        - name: date.gte
          in: query
          required: false
          description: 'Only events with `event.date` on or after this moment. Parsed by `parse_str_to_date` (`corehq/apps/api/util.py:96-105`) -- a bare `YYYY-MM-DD` date, or anything `dateutil.parser.parse` accepts, **which includes a `Z` or a `+HH:MM` offset**. The parsed value is applied as a plain Django ORM filter (`django_date_filter`, `corehq/apps/api/util.py:108-129`, via `MessagingSubEvent.objects...filter(**filters)`, `view.py:56,63`); because `settings.USE_TZ = False` (`settings.py:57`), `DateTimeField.get_prep_value` (`django/db/models/fields/__init__.py:1663-1677`) never rewrites an aware value, so an offset is accepted and passed through to Postgres unconverted -- the same mechanism traced for `last_modified.gte` on locations/v2, and the same acceptance as cases/v2''s date filters (both reuse this same `parse_str_to_date` helper). Unlike case/v1''s `*_start`/`*_end`, an offset here is **not** rejected. An unparsable value raises `InvalidFilterError` (a `BadRequest` subclass, `filters.py:44-48`), returned as the standard `{"error": ...}` 400 body. `format: date-time` is deliberately not declared since the bare-date form is not itself an RFC3339 date-time, and response values are naive (see the `MessagingEvent.date` schema description).'
          example: '2020-07-13T06:30:21.109409'
          schema:
            type: string
        - name: date.gt
          in: query
          required: false
          description: Only events with `event.date` strictly after this moment. Same parsing as `date.gte`.
          example: '2020-07-13T06:30:21.109409'
          schema:
            type: string
        - name: date.lte
          in: query
          required: false
          description: Only events with `event.date` on or before this moment. Same parsing as `date.gte`.
          example: '2021-05-01'
          schema:
            type: string
        - name: date.lt
          in: query
          required: false
          description: Only events with `event.date` strictly before this moment. Same parsing as `date.gte`.
          example: '2021-05-01'
          schema:
            type: string
        - name: date_last_activity.gte
          in: query
          required: false
          description: Only events with `event.date_last_activity` on or after this moment. Same parsing and offset acceptance as `date.gte` (`COMPOUND_FILTERS`, `filters.py:169-172`, applies the identical `_get_date_filter_consumer` machinery to this field). **Not listed in `messaging-events.rst`'s filter table** (`:31-95`), which documents only the `date.*` family -- see the discrepancy file.
          example: '2020-07-13T06:30:21.109409'
          schema:
            type: string
        - name: date_last_activity.gt
          in: query
          required: false
          description: Only events with `event.date_last_activity` strictly after this moment. Undocumented in `messaging-events.rst`; see `date_last_activity.gte`.
          example: '2020-07-13T06:30:21.109409'
          schema:
            type: string
        - name: date_last_activity.lte
          in: query
          required: false
          description: Only events with `event.date_last_activity` on or before this moment. Undocumented in `messaging-events.rst`; see `date_last_activity.gte`.
          example: '2021-05-01'
          schema:
            type: string
        - name: date_last_activity.lt
          in: query
          required: false
          description: Only events with `event.date_last_activity` strictly before this moment. Undocumented in `messaging-events.rst`; see `date_last_activity.gte`.
          example: '2021-05-01'
          schema:
            type: string
        - name: content_type
          in: query
          required: false
          description: Filter on the event's content type, e.g. `sms`, `sms-survey`, `email`, `manual-sms`, `api-sms`, `chat-sms`. Comma-separate several values to OR them; some values additionally expand to related types (e.g. `sms-survey` also matches `ivr-survey`) (`_get_content_type_filter_consumer`, `filters.py:76-91`). **If not one comma-separated value matches a known slug, the request raises an uncaught `TypeError` and returns an unhandled 500, not a 400** -- `_make_slug_filter_consumer`'s inner function (`filters.py:100-113`) falls through to an implicit `None` return when nothing matches, and `filter_query` (`.../filters.py:19-22`) does `filters.update(None)`. See the discrepancy file; this is unlike `status`, which validates and raises a proper `BadRequest`.
          example: sms
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Filter on the event's source, e.g. `broadcast` (also matches `scheduled-broadcast`/`immediate-broadcast`), `scheduled-broadcast`, `immediate-broadcast`, `keyword`, `reminder` (also matches the internal case-rule source), `conditional-alert` (`_get_source_filter_consumer`, `filters.py:61-74`). Comma-separate several values to OR them. Same all-unrecognized-values 500 caveat as `content_type` -- see the discrepancy file.
          example: broadcast
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 'Filter on the event''s status: `error`, `completed`, `in-progress`, or `not-completed` (unlike the response field, this filter does not accept `unknown`). Applied to the event and, for `error` and `in-progress`, to related messages/XForm sessions too (`_status_filter_consumer`, `filters.py:116-136`, matching `MessagingEventsReport.get_filters`). An unrecognized value raises a proper `BadRequest` -- `''<value>'' is not a valid value for the ''status'' filter` -- returned as the standard 400 body.'
          example: error
          schema:
            type: string
        - name: error_code
          in: query
          required: false
          description: Exact match on the event's error code, e.g. `NO_PHONE_NUMBER`, `NO_RECIPIENT`, `NO_MESSAGE`. Not validated against a known list of codes.
          example: NO_MESSAGE
          schema:
            type: string
        - name: phone_number
          in: query
          required: false
          description: Substring match (`__contains`, not exact) against the phone number of any SMS linked to the event (`SIMPLE_FILTERS["phone_number"]`, `filters.py:161-163`). Must be a value `validate_phone_number` (`corehq/apps/sms/util.py`) accepts, or the request fails with a 400.
          example: '1234567'
          schema:
            type: string
        - name: email_address
          in: query
          required: false
          description: Exact match against the recipient email address of any email linked to the event. Must be a value Django's `validate_email` accepts, or the request fails with a 400.
          example: user@example.com
          schema:
            type: string
        - name: case_id
          in: query
          required: false
          description: Exact match on the event's related case ID.
          example: 523132e0-a562-4be1-bbc8-a634423c5c0c
          schema:
            type: string
        - name: order_by
          in: query
          required: false
          description: Sort order. `date_last_activity` (default, ascending) or `-date_last_activity` (descending) -- the only two accepted values (`get_order_by_field`, `corehq/apps/api/resources/messaging_event/utils.py:35-45`); a note in that function records that sorting by `date` was removed because it would require too large an index. Any other value raises a 400 `"No matching '<field_name>' field for ordering"`. Sorting by `date_last_activity` also determines whether the next cursor's synthetic filter is `date.gte` (ascending) or `date.lte` (descending) (`_get_cursor`, `.../pagination.py:58-61`).
          example: date_last_activity
          schema:
            type: string
            enum:
              - date_last_activity
              - -date_last_activity
      responses:
        '200':
          description: A cursor-paginated page of messaging events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagingEventList'
        '400':
          description: 'An invalid `limit`, an unparsable date filter value, an unrecognized `order_by` or `status` value, or a `phone_number` / `email_address` that fails validation. Every one of these is a `tastypie.exceptions.BadRequest` (or subclass) caught by the view''s own `try`/`except` (`view.py:34,40-41`) and rendered as `{"error": ...}`. **Not** raised for an unrecognized `content_type` or `source` value -- see that parameter''s description and the discrepancy file.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Authentication failed. The response is scheme-dependent and typically has no JSON body (a bare challenge response, e.g. a `WWW-Authenticate` header for digest auth) rather than the `{"error": ...}` shape most other resources in this spec use.'
        '403':
          description: 'The authenticated user is not a member of this domain, or lacks the Edit Data permission. Either way the body is not the shared `{"error": ...}` shape -- either empty, or Django''s default HTML 403 page.'
        '429':
          description: The request was rate limited. The response body is empty; the `Retry-After` header carries the number of seconds to wait.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
  /a/{domain}/api/messaging-event/v1/{event_id}/:
    parameters:
      - $ref: '#/components/parameters/Domain'
      - name: event_id
        in: path
        required: true
        description: Numeric `MessagingSubEvent` ID. The urlconf pattern is `\d+` (`corehq/apps/api/urls.py:140`), so non-digit values do not resolve to this operation at all.
        example: '10215869'
        schema:
          type: string
          pattern: ^\d+$
    get:
      operationId: getMessagingEvent
      summary: Retrieve a single messaging event
      description: Requires the Edit Data permission and API access, same as the list operation. Looks the event up scoped to this domain (`_get_base_query(request.domain).get(id=event_id)`, `view.py:46,62-63`) -- an id that exists but belongs to another domain is reported as not found, the same as one that does not exist at all.
      tags:
        - SMS
      responses:
        '200':
          description: The messaging event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagingEvent'
        '401':
          description: Authentication failed. Same scheme-dependent, typically non-JSON response as `listMessagingEvents`'s 401 -- see that operation's description for the full trace.
        '403':
          description: The authenticated user is not a member of this domain, or lacks the Edit Data permission. Same two non-JSON shapes as `listMessagingEvents`'s 403 -- see that operation's description.
        '404':
          description: No event with this id exists in this project space. The response body is empty.
        '429':
          description: The request was rate limited. The response body is empty; the `Retry-After` header carries the number of seconds to wait.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: |-
        API key authentication. Send the header as `Authorization: ApiKey <email>:<api_key>`.
        This is not a registered HTTP authentication scheme, so it is described here as an apiKey header rather than as `type: http`. Generate a key under Account Settings in CommCare HQ.
    Basic:
      type: http
      scheme: basic
      description: HTTP Basic authentication with a CommCare username and password. For mobile workers the username is `<username>@<domain>.commcarehq.org`.
    OAuth2:
      type: http
      scheme: bearer
      description: 'OAuth2 bearer token, sent as `Authorization: Bearer <token>`.'
  parameters:
    Domain:
      name: domain
      in: path
      required: true
      description: The project space name.
      example: demo
      schema:
        type: string
    Offset:
      name: offset
      in: query
      required: false
      description: 'Number of records to skip. Default: 0.'
      example: 100
      schema:
        type: integer
        minimum: 0
        default: 0
    Format:
      name: format
      in: query
      required: false
      description: Response serialization format.
      example: json
      schema:
        type: string
        enum:
          - json
          - xml
        default: json
    Limit:
      name: limit
      in: query
      required: false
      description: 'Maximum number of records to return. Default: 20. Maximum: 1000.'
      example: 100
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
  schemas:
    PaginationMeta:
      type: object
      description: Offset-based pagination metadata returned by most list endpoints.
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        next:
          type: string
          nullable: true
          description: Relative URL of the next page, or null on the last page.
          example: /a/demo/api/form/v1/?limit=20&offset=20
        previous:
          type: string
          nullable: true
          description: Relative URL of the previous page, or null on the first page.
          example: null
        total_count:
          type: integer
          description: Total number of matching records.
          example: 6909
    PaginatedResponse:
      type: object
      description: Standard list envelope. Resource-specific responses narrow `objects` using allOf.
      required:
        - meta
        - objects
      properties:
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        objects:
          type: array
          items:
            type: object
    Case:
      type: object
      description: A single case, as returned by the case data API (JSON format). Most of a case's identifying and business data lives in the nested `properties` object rather than at the top level -- see that property's description. Fields declared by `v0_3.CommCareCaseResource` (`corehq/apps/api/resources/v0_3.py:19-76`) and `v0_4.CommCareCaseResource` (`corehq/apps/api/resources/v0_4.py:186-233`).
      properties:
        id:
          type: string
          description: Case UUID. Identical to `case_id` -- both are aliases of the same attribute.
          example: 0X9OCW3JMV98EYOVN32SGN4II
        case_id:
          type: string
          description: Case UUID.
          example: 0X9OCW3JMV98EYOVN32SGN4II
        domain:
          type: string
          description: Project space the case belongs to.
          example: demo
        user_id:
          type: string
          nullable: true
          description: UUID of the user that last modified the case.
          example: 3c5a623af057e23a32ae4000cf291339
        date_modified:
          type: string
          format: date-time
          description: 'Date and time the case was last modified, from the submitting phone''s clock. Genuinely `Z`-suffixed RFC3339, regardless of the underlying `modified_on` Django `DateTimeField` being naive (`settings.USE_TZ = False`, `settings.py:57`): `CommCareCase.to_json` (`corehq/form_processor/models/cases.py:426-434`) serializes it via `CommCareCaseSerializer` (`corehq/form_processor/serializers.py: 172-180`, a plain DRF `ModelSerializer` with no per-field override), whose default `DateTimeField.to_representation` (`rest_framework/fields.py:1198-1214`) uses `output_format = getattr(self, ''format'', api_settings.DATETIME_FORMAT)`. This project sets `REST_FRAMEWORK = {''DATETIME_FORMAT'': ''%Y-%m-%dT%H:%M:%S.%fZ''}` (`settings.py:2083-2085`), so DRF takes the `value.strftime(output_format)` branch and appends a literal `Z` unconditionally -- timezone-awareness never enters into it, since that branch is not the ISO-8601 one that would otherwise gate the suffix on the value being aware-and-UTC.'
          example: '2016-11-29T14:50:41.156000Z'
        closed:
          type: boolean
          description: Whether the case is closed.
          example: false
        date_closed:
          type: string
          format: date-time
          nullable: true
          description: Date and time the case was closed, `Z`-suffixed RFC3339 (same reasoning as `date_modified`; source field `closed_on`).
          example: '2011-12-20T15:09:47.000000Z'
        server_date_modified:
          type: string
          format: date-time
          description: Date and time the case was last modified, from the server's clock. `Z`-suffixed RFC3339 (same reasoning as `date_modified`; source field `server_modified_on`).
          example: '2012-04-05T23:56:41.000000Z'
        server_date_opened:
          type: string
          format: date-time
          nullable: true
          description: Date and time the case was opened, from the server's clock. `Z`-suffixed RFC3339 (same reasoning as `date_modified`; source field `server_opened_on`).
          example: '2012-04-05T23:56:41.000000Z'
        indexed_on:
          type: string
          format: date-time
          description: 'Date and time this revision of the case was indexed into Elasticsearch. This is the recommended field to page through results on (see `indexed_on_start`/`indexed_on_end` on the list operation) -- it handles edge cases `server_date_modified` does not. Also `Z`-suffixed RFC3339, by a different mechanism than the other date fields: `ElasticCase._from_dict` sets it to `json_format_datetime(datetime.utcnow())` (`corehq/apps/es/cases.py:84`), and `json_format_datetime` (`corehq/ex-submodules/dimagi/utils/parsing.py:48-60`) always strftimes with the literal format `%Y-%m-%dT%H:%M:%S.%fZ` -- a `Z` and always-six-digit microseconds on every value, independent of DRF.'
          example: '2012-04-05T23:56:41.000000Z'
        opened_by:
          type: string
          nullable: true
          description: UUID of the user that opened the case. Undocumented in `cases-v1.rst`; see the discrepancy file.
          example: 3c5a623af057e23a32ae4000cf291339
        closed_by:
          type: string
          nullable: true
          description: UUID of the user that closed the case. Undocumented in `cases-v1.rst`; see the discrepancy file.
          example: 3c5a623af057e23a32ae4000cf291339
        xform_ids:
          type: array
          items:
            type: string
          description: UUIDs of forms that have touched this case.
          example:
            - 3HQEXR2S0GIRFY2GF40HAR7ZE
        properties:
          type: object
          additionalProperties: true
          description: Case property values -- arbitrary, application-defined case data. Always includes the special properties `case_name`, `case_type`, `date_opened`, `external_id`, and `owner_id` (`corehq/apps/api/models.py:201-212`), plus every dynamic case property the application defines. Because dynamic properties are application-defined, their names and types cannot be enumerated here.
          example:
            case_name: ryan
            case_type: programmer
            date_opened: '2012-03-13T18:21:52'
            external_id: 45WKYXQRFFU3AT4Y022EX7HF2
            owner_id: null
            role: artisan
        indices:
          type: object
          additionalProperties:
            type: object
            properties:
              case_type:
                type: string
                description: Case type of the referenced case.
                example: mother
              case_id:
                type: string
                description: UUID of the referenced case.
                example: 8GPM05TVPIUH0Q4XLXVIURRTA
              relationship:
                type: string
                enum:
                  - child
                  - extension
                description: The index's relationship to the referenced case. Unconditional on every index entry, and undocumented in `cases-v1.rst`; see the discrepancy file. Backed by `CommCareCaseIndex.relationship_id`, a `PositiveSmallIntegerField` restricted to exactly two `choices` (`corehq/form_processor/models/cases.py:1090-1097`), mapped to the string constants `CASE_INDEX_CHILD`/`CASE_INDEX_EXTENSION` (`corehq/ex-submodules/casexml/apps/case/const.py:50-51`).
                example: child
          description: References to other cases, keyed by index identifier. An empty object when the case has no indices. Each entry always has `case_type`, `case_id`, and `relationship` (`get_index_map`, `corehq/form_processor/models/cases.py:839-846`).
          example: {}
        xforms_by_name:
          type: object
          additionalProperties: true
          description: Forms that have touched this case, keyed by form name, each value a list of full form representations. Included only when the `xforms_by_name__full=true` query parameter is passed.
        xforms_by_xmlns:
          type: object
          additionalProperties: true
          description: Forms that have touched this case, keyed by XMLNS, each value a list of full form representations. Included only when the `xforms_by_xmlns__full=true` query parameter is passed.
        child_cases:
          type: object
          additionalProperties: true
          description: Child cases, keyed by case id, each value a full case representation. Included only when the `child_cases__full=true` query parameter is passed.
        parent_cases:
          type: object
          additionalProperties: true
          description: Parent cases, keyed by case id, each value a full case representation. Included only when the `parent_cases__full=true` query parameter is passed.
    CaseList:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            objects:
              type: array
              items:
                $ref: '#/components/schemas/Case'
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable description of the failure.
          example: not authorized
    CaseV2IndexEntry:
      type: object
      description: One entry of a case's `indices` map, as returned by the read endpoints. Every entry always carries all three keys.
      properties:
        case_id:
          type: string
          description: UUID of the referenced case.
          example: eb1a8c23-6d6d-4b61-894c-ae1c437d8dac
        case_type:
          type: string
          description: Case type of the referenced case.
          example: household
        relationship:
          type: string
          enum:
            - child
            - extension
          description: This index's relationship to the referenced case.
          example: child
    CaseV2:
      type: object
      description: 'A single case, as returned by every read endpoint of the Case Data API v2. Two serializers produce this shape and they are kept deliberately equivalent: `serialize_es_case` (`corehq/apps/hqcase/api/core.py:39-67`), used by the list, single-`case_id` and bulk endpoints, reads the case-search Elasticsearch document; `serialize_case` (`corehq/apps/hqcase/api/core.py:6-32`), used by the by-external-id read and by every create/update response, reads the SQL model directly. A test asserts the two agree field for field (`corehq/apps/hqcase/tests/test_serialization.py:110-121`). Note that, unlike case/v1, the identifying fields (`case_type`, `case_name`, `external_id`, `owner_id`, `date_opened`) are top-level here and are NOT repeated inside `properties`.'
      properties:
        domain:
          type: string
          description: Project space the case belongs to.
          example: queens-gambit
        case_id:
          type: string
          description: Case UUID, assigned by the server when the case is created.
          example: 79e25a30-8db5-4a5a-827b-0297b254e87f
        case_type:
          type: string
          description: The case type.
          example: patient
        case_name:
          type: string
          description: The case name.
          example: Elizabeth Harmon
        external_id:
          type: string
          nullable: true
          description: Caller-assigned identifier. Not constrained to be unique -- CommCare will happily hold several cases with the same `external_id`, and the by-external-id endpoints return a 400 when that happens.
          example: '1'
        owner_id:
          type: string
          nullable: true
          description: UUID of the case owner -- a mobile worker, a case-sharing group, or a location. Not validated server-side on write.
          example: 20cc9dda-b90a-4af3-aa3d-fc67184e73ef
        date_opened:
          type: string
          format: date-time
          nullable: true
          description: 'Date and time the case was opened (`opened_on`). Unlike case/v1''s date fields, v2''s really are RFC3339: both serializers emit `%Y-%m-%dT%H:%M:%S.%fZ` -- a literal `Z` and always-six-digit microseconds. On the SQL path that comes from `json_format_datetime` (`corehq/apps/hqcase/api/core.py:35-36`, `corehq/ex-submodules/dimagi/utils/parsing.py:44,48-60`); on the Elasticsearch path the stored value was written by `CommCareCase.to_json` (`corehq/form_processor/models/cases.py:426-434`) through DRF''s `DateTimeField`, which formats with `REST_FRAMEWORK[''DATETIME_FORMAT''] = ''%Y-%m-%dT%H:%M:%S.%fZ''` (`settings.py:2083-2085`) -- the same string. The value is UTC.'
          example: '2020-03-19T14:31:34.133000Z'
        last_modified:
          type: string
          format: date-time
          description: Date and time the case was last modified as reported by the submitting device's clock (`modified_on`). Same always-`Z` format as `date_opened`.
          example: '2020-03-19T14:31:34.133000Z'
        server_last_modified:
          type: string
          format: date-time
          description: Date and time the case was last modified as recorded by the server's clock (`server_modified_on`). Same always-`Z` format as `date_opened`.
          example: '2020-03-19T14:31:34.133000Z'
        indexed_on:
          type: string
          format: date-time
          description: Date and time this revision of the case was indexed into the case-search Elasticsearch index. This is the field the cursor pagination of the list endpoint sorts and pages on, and it changes without notice during routine maintenance operations. On responses served from Elasticsearch it is the real index time; on create/update responses, and on the by-external-id read, the case has not been indexed yet, so `serialize_case` substitutes the current server time (`corehq/apps/hqcase/api/core.py:20`) -- the value is a timestamp of when the response was built, not of an indexing event.
          example: '2020-03-19T14:31:34.133000Z'
        closed:
          type: boolean
          description: Whether the case is closed. Always present.
          example: false
        date_closed:
          type: string
          format: date-time
          nullable: true
          description: Date and time the case was closed (`closed_on`). Always present, and `null` for open cases. Same always-`Z` format as `date_opened`.
          example: null
        properties:
          type: object
          additionalProperties:
            type: string
          description: 'User-defined case properties only. Values are strings -- writes reject any non-string value (`valid_properties_dict`, `corehq/apps/hqcase/api/updates.py:23-33`). Unlike case/v1, the case''s metadata (`case_name`, `case_type`, `date_opened`, `external_id`, `owner_id`) is NOT repeated in here: the Elasticsearch serializer strips every key in `INDEXED_METADATA_BY_KEY` (`corehq/apps/hqcase/api/core.py:54-58`, `corehq/apps/case_search/const.py:53-102`) and the SQL serializer reads only `dynamic_case_properties()`. Because these properties are application-defined, their names cannot be enumerated here.'
          example:
            dob: '1948-11-02'
        indices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CaseV2IndexEntry'
          description: References from this case to other cases, keyed by index identifier (conventionally `parent` or `host`, but any valid XML element name is allowed). An empty object when the case has no indices. Deleted indices are omitted (`corehq/apps/hqcase/api/core.py:30`). To find the cases that point AT this case, use the list endpoint's `indices.<name>` filter instead -- reverse indices are never included here.
          example:
            parent:
              case_id: eb1a8c23-6d6d-4b61-894c-ae1c437d8dac
              case_type: household
              relationship: child
    CaseV2List:
      type: object
      description: The list endpoint's envelope. Note that this API does NOT use the `meta`/`objects` envelope the rest of CommCare's list endpoints use -- it has its own three keys, built in `get_list` (`corehq/apps/hqcase/api/get_list.py:102-118`).
      required:
        - matching_records
        - cases
      properties:
        matching_records:
          type: integer
          description: Total number of cases matching the query, across all pages -- not the number returned in this page. Taken from the Elasticsearch hit total (`corehq/apps/hqcase/api/get_list.py:103`).
          example: 1
        cases:
          type: array
          description: This page of cases, oldest `indexed_on` first.
          items:
            $ref: '#/components/schemas/CaseV2'
        next:
          type: string
          description: Absolute URL of the next page. **Present only when another page exists** -- the key is absent, not null, on the last page (`corehq/apps/hqcase/api/get_list.py:109-116`). The URL carries a single opaque `cursor` parameter that encodes the original query plus the position to resume from; follow it verbatim and do not attempt to construct or decode it. Any query parameters sent alongside a `cursor` are discarded in favour of the ones encoded inside it (`corehq/apps/hqcase/api/get_list.py:85-91`), which is how `fields` / `exclude` filtering survives across pages.
          example: https://www.commcarehq.org/a/demo/api/case/v2/?cursor=Y2FzZV90eXBlPXBhdGllbnQ%3D
    CaseV2WriteIndexEntry:
      type: object
      description: One entry of the `indices` map on a write payload (`JsonIndex`, `corehq/apps/hqcase/api/updates.py:43-66`). Identify the referenced case with exactly one of `case_id`, `external_id`, or `temporary_id`; supplying more than one is a 400. When one of them is supplied, `case_type` and `relationship` both become required. Supplying none of the three deletes the index.
      properties:
        case_id:
          type: string
          description: UUID of an existing case to point at.
          example: eb1a8c23-6d6d-4b61-894c-ae1c437d8dac
        external_id:
          type: string
          description: External id of the case to point at. Resolved against cases created earlier in the same request first, then against the database; an external id that resolves to nothing is a 400.
          example: beth
        temporary_id:
          type: string
          description: '`temporary_id` of another case in the same bulk payload. Lets a case and its parent be created in one request.'
          example: '1'
        case_type:
          type: string
          description: Case type of the referenced case. Required unless the index is being deleted.
          example: household
        relationship:
          type: string
          enum:
            - child
            - extension
          description: Relationship to the referenced case. Required unless the index is being deleted. `extension` requires the Extension Cases feature flag.
          example: child
    CaseV2Update:
      type: object
      description: Body for updating one existing case (`JsonCaseUpdate`, `corehq/apps/hqcase/api/updates.py:149-163`). Every field is optional; omitted fields are left untouched (omitting `external_id` does not clear it). The case must already exist -- there is no upsert on this payload. Any field not listed here is rejected with `"'<field>' is not a valid field."`, `create` included.
      properties:
        case_id:
          type: string
          description: Identifies the case to update. On `PUT /a/{domain}/api/case/v2/{case_id}` the path value is used and this may be omitted -- but if it IS supplied it takes precedence over the path (`corehq/apps/hqcase/views.py:257-258`), so a mismatched value silently updates a different case. On `PUT /a/{domain}/api/case/v2/` one of `case_id` or `external_id` is required.
          example: 5160d95d-efdc-4fbb-ba11-5f5bccdde950
        external_id:
          type: string
          maxLength: 255
          description: Sets the case's external id. Doubles as the case selector when `case_id` is absent, in which case it must resolve to exactly one existing case or the request is a 400.
          example: '1'
        case_type:
          type: string
          maxLength: 255
          example: patient
        case_name:
          type: string
          maxLength: 255
          example: Elizabeth Harmon
        owner_id:
          type: string
          maxLength: 255
          description: Reassigns the case. Not validated server-side.
          example: 20cc9dda-b90a-4af3-aa3d-fc67184e73ef
        properties:
          type: object
          additionalProperties:
            type: string
          description: Case properties to set. Merged into the case's existing properties; properties not mentioned are left alone. Same string-value and XML-element-name rules as on create.
          example:
            dob: '1948-11-02'
        indices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CaseV2WriteIndexEntry'
          description: Indices to set. An entry with none of `case_id`/`external_id`/ `temporary_id` deletes that index.
          example:
            parent:
              case_id: eb1a8c23-6d6d-4b61-894c-ae1c437d8dac
              case_type: household
              relationship: child
        close:
          type: boolean
          default: false
          description: Close the case as part of this request.
          example: false
    CaseV2BulkChange:
      type: object
      description: One entry of a bulk payload. `create` is **required on every entry** and selects which of the three payload shapes above applies (`_get_bulk_updates`, `corehq/apps/hqcase/api/updates.py:239-260`). All other constraints are those of the selected shape.
      required:
        - create
      properties:
        create:
          type: boolean
          nullable: true
          description: '`true` -- treat this entry as a creation (`CaseV2Create` rules; `case_id` is rejected). `false` -- treat it as an update (`CaseV2Update` rules; `case_id` or `external_id` required, and the case must already exist). `null` -- upsert on `external_id` (`CaseV2Upsert` rules; `external_id` required, `case_id` rejected). The key itself may never be omitted: doing so fails the whole request with `"A ''create'' flag is required for each update."`'
          example: true
        case_id:
          type: string
          description: Rejected when `create` is `true` or `null`; the selector when `create` is `false`.
          example: 5160d95d-efdc-4fbb-ba11-5f5bccdde950
        case_type:
          type: string
          maxLength: 255
          example: mother
        case_name:
          type: string
          maxLength: 255
          example: Cersei Lannister
        owner_id:
          type: string
          maxLength: 255
          example: 20cc9dda-b90a-4af3-aa3d-fc67184e73ef
        external_id:
          type: string
          maxLength: 255
          example: beth
        temporary_id:
          type: string
          description: Request-scoped alias for this case, so other entries in the same payload can point their indices at it before it has a `case_id`. Must be unique within the request. Never stored. Only valid when `create` is `true`.
          example: '1'
        properties:
          type: object
          additionalProperties:
            type: string
          description: User-defined case properties. All values must be strings.
          example:
            dob: '1988-11-02'
        indices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CaseV2WriteIndexEntry'
          description: Indices to set, keyed by index identifier.
          example:
            parent:
              temporary_id: '1'
              case_type: mother
              relationship: child
        close:
          type: boolean
          default: false
          example: false
    CaseV2BulkChangeList:
      type: array
      description: 'A bulk payload: a JSON array of case changes. At most 100 entries (`CASEBLOCK_CHUNKSIZE`, `corehq/apps/hqcase/utils.py:28`); more is a 400 and nothing is saved. All entries are applied by a single generated form submission, so the whole batch succeeds or fails together.'
      maxItems: 100
      items:
        $ref: '#/components/schemas/CaseV2BulkChange'
    CaseV2WriteResponse:
      type: object
      description: Response to a create or update whose request body was a single JSON object (`corehq/apps/hqcase/views.py:286-289`).
      required:
        - form_id
        - case
      properties:
        form_id:
          type: string
          description: UUID of the form generated on the server to make this change. Note the key is `form_id`; `cases-v2.rst` calls it `xform_id` -- see the discrepancy file.
          example: 1de6ee6b-3f3e-4a5e-9d80-71e2ce1b1e9f
        case:
          allOf:
            - $ref: '#/components/schemas/CaseV2'
          description: The case as it stands after the change. `fields` / `exclude` query parameters apply to this object but not to `form_id`.
    CaseV2BulkWriteResponse:
      type: object
      description: Response to a create or update whose request body was a JSON array (`corehq/apps/hqcase/views.py:281-285`). Note the key is `cases`, not `case`, and there is still exactly one `form_id` for the whole batch.
      required:
        - form_id
        - cases
      properties:
        form_id:
          type: string
          description: UUID of the single form generated to apply every change in the batch. `cases-v2.rst` calls it `xform_id` -- see the discrepancy file.
          example: 1de6ee6b-3f3e-4a5e-9d80-71e2ce1b1e9f
        cases:
          type: array
          description: The cases after the change, in the order they were submitted. `fields` / `exclude` query parameters apply to each element.
          items:
            $ref: '#/components/schemas/CaseV2'
    CaseV2SubmissionError:
      type: object
      description: Error body used when a write got as far as being submitted as a form and then failed during form processing (`SubmissionError`, `corehq/apps/hqcase/views.py:275-279`). No case changes were made. It differs from the shared `Error` schema by carrying the extra `form_id` of the recorded `XFormError`.
      required:
        - error
        - form_id
      properties:
        error:
          type: string
          description: Human-readable description of the failure.
          example: 'IllegalCaseId: Case is not in the domain'
        form_id:
          type: string
          description: UUID of the `XFormError` recorded for the failed submission.
          example: 1de6ee6b-3f3e-4a5e-9d80-71e2ce1b1e9f
    CaseV2Create:
      type: object
      description: Body for creating one case (`JsonCaseCreation`, `corehq/apps/hqcase/api/updates.py:128-146`). `case_id` is rejected -- the server assigns it. Any field not listed here is rejected with `"'<field>' is not a valid field."`; in particular `create` is a bulk-only field and is rejected on a single-case payload.
      required:
        - case_type
        - case_name
        - owner_id
      properties:
        case_type:
          type: string
          maxLength: 255
          description: Required.
          example: patient
        case_name:
          type: string
          maxLength: 255
          description: Required.
          example: Elizabeth Harmon
        owner_id:
          type: string
          maxLength: 255
          description: Required. UUID of the owning mobile worker, group, or location. Not validated.
          example: 20cc9dda-b90a-4af3-aa3d-fc67184e73ef
        external_id:
          type: string
          maxLength: 255
          description: 'Optional caller-assigned identifier. **Not** deduplicated: posting a payload whose `external_id` already exists creates a second case with the same `external_id`. Use `PUT /a/{domain}/api/case/v2/ext/{external_id}/` if you want upsert semantics.'
          example: '1'
        temporary_id:
          type: string
          description: Only meaningful inside a bulk payload, where other entries can reference this case by it. Accepted and ignored on a single-case create. Never stored.
          example: '1'
        properties:
          type: object
          additionalProperties:
            type: string
          description: User-defined case properties. Every value must be a string. Every name must be a valid XML element name (not blank, letters and digits only, not starting with a digit or with `xml`) and must not collide with a top-level field name such as `case_name` (`corehq/apps/hqcase/api/updates.py:23-33`).
          example:
            dob: '1948-11-02'
        indices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CaseV2WriteIndexEntry'
          description: Indices to set, keyed by index identifier. Identifiers must be valid XML element names.
          example:
            parent:
              case_id: eb1a8c23-6d6d-4b61-894c-ae1c437d8dac
              case_type: household
              relationship: child
        close:
          type: boolean
          default: false
          description: Close the case as part of this request.
          example: false
    CaseV2MissingStub:
      type: object
      description: 'Placeholder returned in `cases` for an id that matched no case in this project space (`_prepare_result`, `corehq/apps/hqcase/api/get_bulk.py:84-106`). It holds exactly two keys: the id that was requested, under `case_id` or `external_id` depending on which list it came from, and `error`. Field filtering (`fields` / `exclude`) is deliberately not applied to stubs (`corehq/apps/hqcase/views.py:139-142`), so `error` cannot be filtered away. Detect a stub by testing for the presence of `error`, not by testing for missing case fields -- `fields` can strip a real case down to very little.'
      required:
        - error
      properties:
        case_id:
          type: string
          description: The requested case UUID. Present when the id came from `case_ids` (or from the comma-separated path segment).
          example: d5e5962a-c5f1-483c-a58a-590167d594a9
        external_id:
          type: string
          description: The requested external id. Present when the id came from `external_ids`.
          example: id1
        error:
          type: string
          enum:
            - not found
          description: Always the literal string `not found` (`corehq/apps/hqcase/api/get_bulk.py:86-87`).
          example: not found
    CaseV2BulkResult:
      type: object
      description: 'The envelope returned by the bulk-fetch endpoint AND by a comma-separated multi-id GET. Both call `_get_bulk_cases` (`corehq/apps/hqcase/views.py:136-143`), so the shape is identical. Note it is a different envelope from the list endpoint''s: there is no `next` (bulk fetches are never paginated) and there is an extra `missing_records`.'
      required:
        - cases
        - matching_records
        - missing_records
      properties:
        cases:
          type: array
          description: One entry per requested id, in the order the ids were supplied. When both `case_ids` and `external_ids` are supplied, the results for `case_ids` come first. An id that matched no case in this project space yields a stub object instead of a case -- see `CaseV2MissingStub`. Tell the two apart by the presence of `error`, which a real case never carries at the top level.
          items:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/CaseV2'
                  - not:
                      $ref: '#/components/schemas/CaseV2MissingStub'
              - $ref: '#/components/schemas/CaseV2MissingStub'
        matching_records:
          type: integer
          description: Number of requested ids that resolved to a case.
          example: 2
        missing_records:
          type: integer
          description: Number of requested ids that did not resolve to a case.
          example: 2
    CaseV2Upsert:
      type: object
      description: Body for `PUT /a/{domain}/api/case/v2/ext/{external_id}/`. The view fills in `external_id` from the path when the body omits it, looks the case up, and then routes the payload to the create path if no case was found or the update path if one was (`_handle_ext_put`, `corehq/apps/hqcase/views.py:224-248`). So `case_type`, `case_name` and `owner_id` are required whenever the case might not exist yet, and optional otherwise -- send them always unless you know the case exists. `create` is not a valid field here.
      properties:
        case_id:
          type: string
          description: 'Optional, and only useful as an assertion: if supplied it must equal the `case_id` of the case the external id resolves to, otherwise the request is a 400 (`corehq/apps/hqcase/views.py:241-246`).'
          example: 5160d95d-efdc-4fbb-ba11-5f5bccdde950
        external_id:
          type: string
          maxLength: 255
          description: Defaults to the value in the path. Supplying a different value here changes the case's external id while still selecting the case by the path value.
          example: '1'
        case_type:
          type: string
          maxLength: 255
          description: Required if the case does not already exist.
          example: patient
        case_name:
          type: string
          maxLength: 255
          description: Required if the case does not already exist.
          example: Elizabeth Harmon
        owner_id:
          type: string
          maxLength: 255
          description: Required if the case does not already exist.
          example: 20cc9dda-b90a-4af3-aa3d-fc67184e73ef
        properties:
          type: object
          additionalProperties:
            type: string
          description: User-defined case properties. Same rules as on create.
          example:
            dob: '1948-11-02'
        indices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CaseV2WriteIndexEntry'
          description: Indices to set, keyed by index identifier.
          example:
            parent:
              case_id: eb1a8c23-6d6d-4b61-894c-ae1c437d8dac
              case_type: household
              relationship: child
        close:
          type: boolean
          default: false
          description: Close the case as part of this request.
          example: false
    CaseV2BulkFetchRequest:
      type: object
