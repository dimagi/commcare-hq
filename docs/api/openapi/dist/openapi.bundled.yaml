  /a/{domain}/api/configurablereportdata/v1/{report_id}/:
    parameters:
      - $ref: '#/components/parameters/Domain'
      - name: report_id
        in: path
        required: true
        description: Report configuration UUID, from `listReports`.
        example: 9aab0eeb88555a7b4568676883e7379a
        schema:
          type: string
    get:
      operationId: downloadReportData
      summary: Run a report and download its result data
      description: |-
        Runs the named report with the given filters and returns a page of result rows (`ConfigurableReportDataResource`, `corehq/apps/api/resources/v0_5.py:812-954`). **Detail only -- `Meta.list_allowed_methods = []`** (`v0_5.py:953`), so there is no list operation for this resource; every report is run by its own id.
        Requires the `View Reports` permission (`RequirePermissionAuthentication(HqPermissions.view_reports, allow_session_auth=True)`, `v0_5.py:952`). `download-report-data.rst` states "Permission Required: View Data, Access All Reports" -- neither name is an actual `HqPermissions` field (`corehq/apps/users/models.py:190-221`); the real check is `view_reports` alone. See the discrepancy file.
        **`filter_name` query parameters are user-defined, not literal.** OpenAPI cannot express "any query parameter matching a report's own filter slugs", so the four parameters below (`<filter_name>`, `<filter_name>-start`, `<filter_name>-end`, `<filter_name>-operator`/`<filter_name>-operand`) are listed with an angle-bracket placeholder that you must replace with a real filter slug from that report's `listReports`/`getReport` `filters[].slug` before sending -- e.g. `?owner_name=someone`, not `?<filter_name>=someone`. Send one member of the family per filter you want to apply: a plain value for a simple filter, `-start`/`-end` for a date-range filter (both required together), or `-operator`/`-operand` together for a numeric comparison filter (`download-report-data.rst: 44-49`). To match multiple values for one filter, join them with the `%1F` (unit separator) character in a single value, e.g. `?state=vermont%1Fnewyork`. Any filter value that fails to parse (for example, an invalid date for a `-start`/`-end` pair) raises `UserReportsFilterError` uncaught by `obj_get` (`corehq/apps/userreports/reports/view.py:82-96`), which is neither tastypie's `NotFound` nor `BadRequest` and so surfaces as an uncaught 500, not a 400 -- undocumented in `download-report-data.rst`; see the discrepancy file.
      tags:
        - Data
      parameters:
        - name: offset
          in: query
          required: false
          description: The record number to start at.
          example: 20
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: The maximum number of records to return. `_get_limit_param` (`v0_5.py:834-844`) rejects a value above 50 with a 400.
          example: 10
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 50
        - name: <filter_name>
          in: query
          required: false
          description: Substitute a report filter's `slug` for `<filter_name>`, e.g. `?owner_name=someone`. Value for a simple (string/choice) filter.
          example: someone
          schema:
            type: string
        - name: <filter_name>-start
          in: query
          required: false
          description: For a date-range filter, the start of the range, e.g. `?form_date-start=2015-01-01`. Required together with the matching `-end` parameter.
          example: '2015-01-01'
          schema:
            type: string
        - name: <filter_name>-end
          in: query
          required: false
          description: For a date-range filter, the end of the range, e.g. `?form_date-end=2015-02-01`. Required together with the matching `-start` parameter.
          example: '2015-02-01'
          schema:
            type: string
        - name: <filter_name>-operator
          in: query
          required: false
          description: 'For a numeric filter, a comparison operator: one of `>= <= = != < >`, e.g. `?age-operator=>`. Required together with the matching `-operand` parameter.'
          example: '>'
          schema:
            type: string
            enum:
              - '>='
              - <=
              - '='
              - '!='
              - <
              - '>'
        - name: <filter_name>-operand
          in: query
          required: false
          description: For a numeric filter, the value to compare against, e.g. `?age-operand=10`.
          example: '10'
          schema:
            type: string
      responses:
        '200':
          description: A page of report result rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurableReportData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authenticated user lacks the View Reports permission, or is not a member of this project space. The response body is empty. Same mechanism as `listReports`'s 403.
        '404':
          description: The report configuration does not exist in this project space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportErrorMessage'
        '429':
          description: The request was rate limited. Back off and retry. The response body is empty. Same mechanism as `listReports`'s 429.
