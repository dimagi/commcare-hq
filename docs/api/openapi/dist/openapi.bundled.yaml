      operationId: replaceLookupTableItem
      summary: Replace a lookup table row
      description: |-
        **No 404 for the common case -- an unknown `lookup_table_item_id` falls back to creating a new row under a different id, exactly like `replaceLookupTable`.** `obj_update` (`v0_1.py:390-409`) raises tastypie's `NotFound` for an unknown id (`v0_1.py:396-400`); `put_detail` catches it and retries via `obj_create` (`v0_1.py:370-388`), which ignores the URL's `pk`.
