        '401':
          description: Authentication credentials were missing or invalid.
        '403':
          description: The authenticated user does not have mobile access to this domain (`_has_mobile_access`, `corehq/apps/receiverwrapper/views.py:79-89`), or the domain requires auth and the credentials are valid but not permitted. Response body is empty (`HttpResponseForbidden()`, `corehq/apps/receiverwrapper/views.py:88-89`).
        '422':
          description: Form received but an error occurred during processing (OpenRosa V3.0 behavior). See `submitForm`'s 422 response.
