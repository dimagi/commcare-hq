        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authenticated user lacks the Edit Locations permission, or the domain lacks the Locations privilege. The response body is empty.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: bulkCreateOrUpdateLocationsV2
      summary: Bulk create or update locations
      description: 'Accepts a list of location payloads under `objects` (`v0_6.LocationResource.patch_list`, `v0_6.py:164-173`, calling the shared `patch_list_replica`, `corehq/apps/api/resources/__init__.py:172-205`). Each item is a create (no `location_id`) or an update (`location_id` present) -- create uses the same validation as `createLocationV2`, update the same as `replaceLocationV2`. Limited to 100 objects per request (`v0_6.LocationResource.patch_limit`, `v0_6.py:27`); exceeding it raises `BadRequest("Object count exceeds limit for PATCH method.")` before any object is processed. The whole batch is atomic (`@atomic` on `patch_list`, `v0_6.py:164`): if any single item fails validation, nothing in the batch is created or updated. **Unlike the group resource''s bulk PATCH, a partial-failure response here is never a positionally-aligned array of ids/errors** -- `patch_list_replica`''s per-item `except AssertionError` (`corehq/apps/api/resources/__init__.py :199-201`) is unreachable for this resource, since every validation failure here raises `LocationAPIError` (a `BadRequest`, not an `AssertionError`). A `BadRequest` propagates straight past `patch_list_replica`''s loop, uncaught, to `wrap_view` (`tastypie/resources.py:244-246`), which converts it to a single `{"error": ...}` object -- the array-of-strings shape is therefore only ever seen on full success. Confirmed by `corehq/apps/locations/tests/test_api_resources.py:401-430` (`response.json() == {''error'': "Could not update: ..."}`, not an array).'
