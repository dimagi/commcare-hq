          in: query
          required: false
          description: 'Locations last modified on or after this date or datetime. This is a real Django ORM filter against `SQLLocation.last_modified` (a `DateTimeField`), not a hand-parsed value like cases/v1''s `*_start`/`*_end`: `build_filters` (`v0_6.py:56-69`) rewrites the dotted key to `last_modified__gte` and passes the raw string straight to the queryset. Django''s `DateTimeField.get_prep_value` (`django/db/models/fields/__init__.py:1186-1190`) calls `to_python`, which tries `django.utils.dateparse.parse_datetime` first (`django/db/models/fields/__init__.py:1621-1630`) -- this accepts a bare date, a naive datetime, **or** one with a UTC offset or literal `Z` (`parse_datetime` handles all of RFC3339). Because `settings.USE_TZ = False` (`settings.py:57`), the naive-vs-aware reconciliation branch in `get_prep_value` (`django/db/models/fields/__init__.py:1198-1200`, `if ... settings.USE_TZ and timezone.is_naive(value)`) never fires either way, so an aware value is passed through unconverted to `adapt_datetimefield_value` (`django/db/backends/postgresql/operations.py:350-351`, a no-op) and compared by Postgres using the session''s own timezone rules -- **unlike case/v1''s `validate_date`, an offset here is accepted, not rejected with a 400.** This is the opposite of case/v1 and was traced directly (not copied from either precedent), per the task brief; it was not re-verified against a live database in this environment (no Postgres/Elasticsearch service was reachable here -- see the discrepancy file), only against Django''s own ORM source.'
          example: '2024-01-01'
          schema:
            type: string
        - name: last_modified.gt
          in: query
          required: false
          description: Locations last modified strictly after this date or datetime. Same parsing as `last_modified.gte`.
          example: '2024-01-01'
          schema:
            type: string
        - name: last_modified.lt
          in: query
          required: false
          description: Locations last modified strictly before this date or datetime. Same parsing as `last_modified.gte`.
          example: '2024-01-01'
          schema:
            type: string
        - name: last_modified.lte
          in: query
          required: false
          description: Locations last modified on or before this date or datetime. Same parsing as `last_modified.gte`.
          example: '2024-01-01'
          schema:
            type: string
        - name: order_by
