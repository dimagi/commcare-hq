          description: '`tag` is missing (`v0_1.py:206-207`), `tag` differs from the existing table''s `tag` (`v0_1.py:217-218`), the fallback-create''s `tag` is already taken by another table (`v0_1.py:196-197`), or `fields`/`item_attributes` fail schema validation (same two-shape 400 as `createLookupTable`).'
