        - success
        - processing_id
      description: Response of `uploadApplicationMultimedia` (`_handle_upload_multimedia`, `app_import_api.py:92-125`). The ZIP is queued for asynchronous processing (`process_bulk_upload_zip.delay`, `:121-123`); this response only confirms the ZIP itself parsed, not that processing succeeded.
      properties:
        success:
          type: boolean
          enum:
            - true
        processing_id:
          type: string
          description: Poll `getMultimediaUploadStatus` with this id.
          example: dl-abc123def456
    MultimediaUploadStatus:
      type: object
      description: 'Response of `getMultimediaUploadStatus` (`_handle_multimedia_status`, `app_import_api.py:138-163`; body built by `BaseMultimediaStatusCache.get_response`/`BulkMultimediaStatusCache. get_response`, `corehq/apps/hqmedia/cache.py:45-99`). **`import-app.rst` documents this as two distinct shapes ("In Progress" at `:235-248` and "Complete" at `:255-284`), modeled with `oneOf` per the task brief -- but the code always returns every one of these keys, with values that are zero/empty/null until processing finishes; there is exactly one shape, not two.** `oneOf` was deliberately not used for that reason (per the project''s `oneOf`-means-disjoint convention: this would not be a disjoint union, it would be the same schema matching itself twice). See the discrepancy file. Also undocumented by either sample: `type` (always `"zip"` for this endpoint) and `is_ready` (mirrors `complete`).'
      required:
        - success
        - type
        - in_celery
        - is_ready
        - complete
        - progress
        - errors
        - processing_id
        - matched_count
        - unmatched_count
        - matched_files
        - unmatched_files
        - total_files
        - processed_files
        - image_count
        - audio_count
        - video_count
        - skipped_files
      properties:
        success:
          type: boolean
          enum:
            - true
        type:
          type: string
          enum:
            - zip
          description: '`BulkMultimediaStatusCache.upload_type` (`cache.py:71`). Undocumented in `import-app.rst`.'
        in_celery:
          type: boolean
          description: Whether the upload is currently being processed by a Celery worker.
        is_ready:
          type: boolean
          description: Mirrors `complete` (`BaseMultimediaStatusCache.get_response`, `cache.py:45-56`). Undocumented in `import-app.rst`.
        complete:
          type: boolean
          description: Whether processing has finished (successfully or with errors).
        progress:
          type: object
          required:
            - percent
            - current
            - total
          properties:
            percent:
              type: integer
              example: 50
            current:
              type: integer
              example: 5
            total:
              type: integer
              example: 10
        errors:
          type: array
          items:
            type: string
          description: Populated only if the task called `mark_with_error` (`cache.py:39-42`); empty otherwise.
        processing_id:
          type: string
          example: dl-abc123def456
        matched_count:
          type: integer
          description: Total across all matched-file categories. `0` until matching completes.
          example: 8
        unmatched_count:
          type: integer
          example: 2
        matched_files:
          type: object
          description: Keyed by multimedia class name; each value is a list of matched file identifiers (opaque strings, not modeled further).
          properties:
            CommCareImage:
              type: array
              items:
                type: string
            CommCareAudio:
              type: array
              items:
                type: string
            CommCareVideo:
              type: array
              items:
                type: string
        unmatched_files:
          type: array
          items:
            type: object
            required:
              - path
              - reason
            properties:
              path:
                type: string
                example: images/extra.png
              reason:
                type: string
        total_files:
          type: integer
          nullable: true
          description: '`null` until the ZIP has been scanned.'
          example: 10
        processed_files:
          type: integer
          nullable: true
          example: 10
        image_count:
          type: integer
          example: 6
        audio_count:
          type: integer
          example: 2
        video_count:
          type: integer
          example: 0
        skipped_files:
          type: array
          items:
            type: object
            required:
              - path
              - mimetype
            properties:
              path:
                type: string
              mimetype:
                type: string
    BulkUploadCasesResponse:
      type: object
      required:
        - code
        - message
      description: Response of `bulkUploadCases` (`bulk_case_upload_api`/ `_bulk_case_upload_api`, `corehq/apps/case_importer/views.py:470-550`). A success code indicates the upload was *processed*, not that every row imported cleanly -- `bulk-upload-cases.rst:89` warns business-level failures (e.g. an invalid location) only surface later, via `status_url`.
      properties:
        code:
          type: integer
          enum:
            - 200
            - 500
          description: '`200` on success (`views.py:550`, HTTP status is also 200). `500` on a caught `ImporterError`/`SpreadsheetFileExtError`/ `SpreadsheetFileInvalidError` (`views.py:474-482`) -- **and here the HTTP transport status genuinely is 500 too** (`json_response(..., status_code=500)`, `views.py:482`), unlike several other endpoints in this API where a `code`/`status` field in the body diverges from the real transport status. Any other exception type is not caught here and produces Django''s own unhandled-error response (HTML, not this JSON shape) -- see the discrepancy file.'
          example: 200
        message:
          type: string
          example: success
        status_url:
          type: string
          description: Present only on success. URL to poll for the status of the queued import job. That status endpoint (`case_importer_upload_status`) is a separate view, out of scope for this spec.
          example: /a/demo/importer/case_importer/status/dl-2998e6834a654ab5ba74f372246caa75/
    CursorMeta:
      type: object
      description: Cursor-based pagination metadata. Used only by the messaging events endpoint. The cursor is opaque and must not be constructed by clients.
      properties:
        limit:
          type: integer
          example: 20
        next:
          type: string
          nullable: true
          description: '**Absolute** URL (scheme and host included) of the next page, carrying an opaque `cursor` parameter, or null when no further records exist. This is a correction of this schema''s original description -- `_get_cursor` (`corehq/apps/api/resources/messaging_event/pagination.py:49-70`) builds it with `reverse(..., absolute=True)` (`corehq/util/view_utils.py:119-129`), which prefixes the URL with `get_url_base()`, not a bare path. `messaging-events.rst:126` shows the same absolute form (`"https://www.commcarehq.org/a/[domain]/api/messaging-event/v1/?cursor=..."`). See the discrepancy file.'
          example: https://www.commcarehq.org/a/demo/api/messaging-event/v1/?cursor=ZGF0ZS5ndGU9MjAyMC0wNS0xN1Q
    MessagingEventError:
      type: object
      nullable: true
      description: Event-level error detail, present only when `error_code` is set on the underlying model; null otherwise (`_serialize_event_error`, `serializers.py:88-94`). Distinct from an individual message's own `error_message`.
      properties:
        code:
          type: string
          description: Error code slug, e.g. `NO_PHONE_NUMBER`, `NO_RECIPIENT`, `NO_MESSAGE`.
          example: NO_PHONE_NUMBER
        message:
          type: string
          nullable: true
          description: Display text for the error code (`MessagingEvent.ERROR_MESSAGES`), or null if the code is not recognized.
          example: Contact has no phone number.
        message_detail:
          type: string
          nullable: true
          description: Additional free-text detail about the error, if any.
          example: null
    MessagingEventForm:
      type: object
      nullable: true
      description: Present only when `content_type` is `sms-survey` or `ivr-survey`; null otherwise (`_serialize_event_form`, `serializers.py:96-105`).
      properties:
        app_id:
          type: string
          nullable: true
          example: 4d6a2b1e8f7c4a3e9b2d1c0f5a6b7c8d
        form_definition_id:
          type: string
          nullable: true
          description: Form unique ID (XMLNS-adjacent identifier), not the app build id.
          example: e1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6
        form_name:
          type: string
          nullable: true
          example: Welcome Survey
        form_submission_id:
          type: string
          nullable: true
          description: ID of the submitted XForm instance, only set once the survey session has produced a submission.
          example: 7f8e9d0c1b2a3948576645362718293a
    MessagingEventMessage:
      type: object
      description: 'One actual message sent or received as part of the event. The shape varies by `type` -- built by one of three helpers depending on the parent event''s `content_type` (`_serialize_event_messages`, `serializers.py:47-56`): `_get_messages_for_email`, `_get_messages_for_sms`, or `_get_messages_for_survey`. `phone_number` is present only on `sms`/`ivr` messages, `email_address` only on `email` messages, and `error_message` is included only when the message actually errored (it is omitted from the dict entirely otherwise, not sent as `null`) -- see `_get_message_dicts_for_sms`, `serializers.py:127-149`.'
      properties:
        message_id:
          type: integer
          description: Numeric ID of the underlying `SMS` or `Email` row (not the event id).
          example: 153444
        type:
          type: string
          description: '`sms`, `ivr`, or `email`.'
          example: sms
        direction:
          type: string
          description: '`outgoing`, `incoming`, or `unknown`. Always `outgoing` for `email` messages.'
          example: outgoing
        content:
          type: string
          description: The actual message body that was sent or received.
          example: Welcome to CommCare
        date:
          type: string
          description: 'Message date. Naive (no UTC offset or `Z`) -- `USE_TZ = False` (`settings.py:57`). For `email` messages this is an explicit `.isoformat()` call (`serializers.py:118`) and keeps full microsecond precision, e.g. `2020-05-15T04:11:27.482899`. For `sms`/`ivr` messages the raw `datetime` is passed straight through (`serializers.py:141`, `"date": sms.date`) and serialized by `JsonResponse`''s default `DjangoJSONEncoder`, which truncates to millisecond precision, e.g. `2021-04-13T21:25:26.989` -- both forms are visible side by side in `messaging-events.rst`''s own sample response (`:154` vs `:163`). `format: date-time` is deliberately not declared since the value carries no timezone.'
          example: '2021-04-13T21:25:26.989'
        date_modified:
          type: string
          nullable: true
          description: Date of the last modification to the message, or null if never modified. Same naive, no-`Z` format as `date`.
          example: null
        status:
          type: string
          description: 'Message status. For `email`: the parent event''s status slug. For `sms`/`ivr`: one of `error`, `queued`, `received`, `forwarded`, `delivered`, `sent`, `unknown` (`get_sms_status_display_raw`, `corehq/apps/reports/standard/message_event_display.py:89-111`).'
          example: sent
        backend:
          type: string
          description: Messaging backend/gateway name, e.g. `MOBILE_BACKEND_TWILIO`. Always the literal string `email` for `email` messages.
          example: MOBILE_BACKEND_TWILIO
        phone_number:
          type: string
          description: Recipient/sender phone number. Present only on `sms`/`ivr` messages.
          example: '+15555993494'
        email_address:
          type: string
          description: Recipient email address. Present only on `email` messages.
          example: patient@example.com
        error_message:
          type: string
          description: Human-readable error detail. Present only when the message actually errored -- omitted from the response entirely otherwise (not sent as `null`).
          example: Gateway error.
    MessagingEventRecipient:
      type: object
      description: The intended recipient of the event (`_serialize_event_recipient`, `serializers.py:66-75`).
      properties:
        recipient_id:
          type: string
          nullable: true
          description: Case ID or user ID. Null if the event has no recipient.
          example: 523132e0-a562-4be1-bbc8-a634423c5c0c
        type:
          type: string
          description: '`case`, `mobile-worker`, `web-user`, or `unknown` (`MessagingSubEvent.RECIPIENT_SLUGS`, `sms/models.py:1648-1652`).'
          example: case
        name:
          type: string
          description: Case or user name, or the literal string `unknown` if it could not be resolved or there is no recipient.
          example: Mary Little
    MessagingEventSource:
      type: object
      description: The trigger for the event, e.g. a broadcast or conditional alert (`_serialize_event_source`, `serializers.py:78-84`).
      properties:
        source_id:
          type: string
          description: ID of the source (e.g. the broadcast or keyword id).
          example: '4654'
        type:
          type: string
          description: Source type slug. One of `broadcast`, `scheduled-broadcast`, `immediate-broadcast`, `keyword`, `reminder`, `conditional-alert`, `forwarded-message`, `other`, or `unknown` if the underlying model value has no slug (`MessagingEvent.SOURCE_SLUGS`, `sms/models.py:1003-1013`).
          example: conditional-alert
        name:
          type: string
          description: Display name of the keyword, broadcast, etc. (`get_event_display_api`, `corehq/apps/reports/standard/message_event_display.py:297-312`).
          example: Email - Welcome Packet
    MessagingEvent:
      type: object
      description: A single messaging event and all of its constituent messages (`serialize_event`, `serializers.py:6-19`). Despite the resource's name this is backed by the `MessagingSubEvent` model, which has the more direct relationship to an individual recipient (`corehq/apps/api/resources/messaging_event/view.py:30-32`).
      properties:
        id:
          type: integer
          description: MessagingSubEvent numeric ID.
          example: 10215869
        content_type:
          type: string
          description: Content type slug, e.g. `sms`, `sms-survey`, `ivr-survey`, `email`, `manual-sms`, `api-sms`, `chat-sms`, or `unknown` (`MessagingEvent.CONTENT_TYPE_SLUGS`, `sms/models.py:1045-1059`).
          example: email
        date:
          type: string
          description: 'Event creation date. Naive (no `Z`/offset) -- an explicit `.isoformat()` call on a `USE_TZ = False` value (`serializers.py:10`), keeping full microsecond precision. `format: date-time` is deliberately not declared.'
          example: '2020-05-15T04:11:27.482899'
        date_last_activity:
          type: string
          description: Date of the last message activity for this event. Useful for exports since `date` is the creation date. Same naive, no-`Z` format as `date`.
          example: '2020-05-15T04:11:27.482899'
        case_id:
          type: string
          nullable: true
          description: ID of the related case, if this event is related to one.
          example: 523132e0-a562-4be1-bbc8-a634423c5c0c
        domain:
          type: string
          description: The project space this event belongs to -- read from the parent `MessagingEvent.domain`, not the subevent's own `domain` field (`serializers.py:14`).
          example: ny-dev-cdcms
        error:
          $ref: '#/components/schemas/MessagingEventError'
        form:
          $ref: '#/components/schemas/MessagingEventForm'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessagingEventMessage'
        recipient:
          $ref: '#/components/schemas/MessagingEventRecipient'
        source:
          $ref: '#/components/schemas/MessagingEventSource'
        status:
          type: string
          description: Event status. Usually one of `error`, `completed`, `in-progress`, `not-completed`, `unknown` (`MessagingEvent.STATUS_SLUGS`), but for a completed survey event this is instead the `XFormsSession` status slug, and a nominally `completed` event is reported as `error` if any of its messages errored (`_serialize_event_status`, `serializers.py:22-33`).
          example: completed
    MessagingEventList:
      type: object
      description: List envelope for `listMessagingEvents`. Deliberately **not** built from `pagination.yaml#/PaginatedResponse`, whose `meta` is fixed to the offset-based `PaginationMeta` -- this is the only cursor-paginated resource in the spec, so `meta` references `CursorMeta` instead (`get_paged_data`, `corehq/apps/api/resources/messaging_event/pagination.py:14-22`).
      required:
        - meta
        - objects
      properties:
        meta:
          $ref: '#/components/schemas/CursorMeta'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/MessagingEvent'
  responses:
    BadRequest:
      description: The request was malformed or a parameter value was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Authentication credentials were missing or invalid. Note that CommCare also returns 401 with `{"error": "not authorized"}` for some permission failures.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated user lacks the permission required for this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: The request was rate limited. Back off and retry. Rate limits are applied per user and project space.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
