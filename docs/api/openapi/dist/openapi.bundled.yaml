          nullable: true
          example: John
        last_name:
          type: string
          nullable: true
          example: Doe
        default_phone_number:
          type: string
          nullable: true
          description: The user's primary phone number (the first entry in `phone_numbers`).
          example: '+50253311399'
        email:
          type: string
          example: jdoe@example.org
        phone_numbers:
          type: array
          items:
            type: string
          description: All phone numbers registered to the user.
          example:
            - '+50253311399'
            - '+50253314588'
        groups:
          type: array
          items:
            type: string
          description: Group UUIDs the user belongs to (`get_group_ids`).
          example:
            - 9a0accdba29e01a61ea099394737c4fb
            - b4ccdba29e01a61ea099394737c4fbf7
        primary_location:
          type: string
          nullable: true
          description: Location UUID of the user's primary location.
          example: 26fc44e2792b4f2fa8ef86178f0a958e
        locations:
          type: array
          items:
            type: string
          description: Location UUIDs the user is assigned to.
          example:
            - 26fc44e2792b4f2fa8ef86178f0a958e
            - c1b029932ed442a6a846a4ea10e46a78
        user_data:
          type: object
          additionalProperties: true
          description: Custom data associated with the user, plus several `commcare_*` keys injected by `dehydrate_user_data` (`corehq/apps/api/resources/v0_1.py:111-124`). Property names beginning with a digit are dropped when `format=xml` (attribute names cannot start with a digit in XML).
          example:
            chw_id: 13/43/DFA
            commcare_project: demo
        eulas:
          type: string
          description: Undocumented in `list-mobile-workers.rst`. A `CharField` over the user's `eulas` attribute (`corehq/apps/api/resources/v0_1.py:34`) -- `tastypie.fields.CharField.convert` calls `str()` on whatever the attribute holds, so this is a Python `repr` of a list of `LicenseAgreement` objects, not structured JSON. See the discrepancy file.
          example: '[]'
        resource_uri:
          type: string
          description: Undocumented in `list-mobile-workers.rst`. Present on every response because `include_resource_uri` defaults to `True` and is never overridden; `CommCareUserResource.get_resource_uri` (`corehq/apps/api/resources/v0_5.py:257-268`) always computes a real detail URL. See the discrepancy file.
          example: /a/demo/api/user/v1/3c5a623af057e23a32ae4000cf291339/
        extras:
          type: object
          description: Present only when the `extras` query parameter is truthy (`CommCareUserResource.dehydrate`, `corehq/apps/api/resources/v0_1.py:76-109`). Adds four Elasticsearch-backed counts; computing them can slow the request.
          properties:
            submitted_last_30:
              type: integer
              example: 4
            completed_last_30:
              type: integer
              example: 3
            submitted_last_month:
              type: integer
              example: 5
            completed_last_month:
              type: integer
              example: 4
    MobileWorkerList:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            objects:
              type: array
              items:
                $ref: '#/components/schemas/MobileWorker'
    MobileWorkerWrite:
      type: object
      description: Payload for both `createMobileWorker` (POST) and `updateMobileWorker` (PUT). `username` and (usually) `password` are required on create only -- `obj_create` (`corehq/apps/api/resources/v0_5.py:270-274,307-308`) requires `username` always and requires either `password` or `connect_username` unless two-stage account confirmation is in effect. `obj_update` (`v0_5.py:351-373`) ignores `username` entirely (it is popped before the generic field updater runs on create, and is never accepted as an update key) -- there is no way to rename a mobile worker through this endpoint. `connect_username` is accepted by the code (`v0_5.py:278,334-338`) but is undocumented in `mobile-worker.rst`; it only works when the `COMMCARE_CONNECT` toggle is enabled for the domain.
      properties:
        username:
          type: string
          description: Required on create. Ignored on update.
          example: jdoe
        password:
          type: string
          description: Required on create unless `connect_username` is given or two-stage account confirmation applies. Optional on update (sets a new password).
          example: qwer1234
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          example: jdoe@example.org
        phone_numbers:
          type: array
          items:
            type: string
          description: The first entry becomes `default_phone_number`. On update, this replaces the existing list.
          example:
            - '+50253311399'
            - '50253314588'
        default_phone_number:
          type: string
          description: 'Undocumented in `mobile-worker.rst`''s Input Parameters table (it does appear, redundantly alongside `phone_numbers`, in the reST page''s own sample input), but a real, separately recognized update key: `CommcareUserUpdates._update_default_phone_number` (`corehq/apps/api/user_updates.py:148,204-214`) adds the number to `phone_numbers` if not already present and marks it the default. See the discrepancy file.'
          example: '+50253311399'
        groups:
          type: array
          items:
            type: string
          description: On update, this replaces the existing group list.
          example:
            - 9a0accdba29e01a61ea099394737c4fb
            - b4ccdba29e01a61ea099394737c4fbf7
        user_data:
          type: object
          additionalProperties: true
          description: On update, this replaces the existing custom data wholesale -- fetch the current value first if you only mean to change part of it.
          example:
            chw_id: 13/43/DFA
        language:
          type: string
          example: en
        primary_location:
          type: string
          description: Must be one of `locations`. On update, pass an empty string to clear it.
          example: 26fc44e2792b4f2fa8ef86178f0a958e
        locations:
          type: array
          items:
            type: string
          description: On update, pass an empty array to clear all assigned locations.
          example:
            - 26fc44e2792b4f2fa8ef86178f0a958e
            - c1b029932ed442a6a846a4ea10e46a78
        require_account_confirmation:
          type: boolean
          default: false
          description: Create only. If `true`, creates an unconfirmed account instead of setting a password; requires `email` and forbids `password`.
          example: true
        send_confirmation_email_now:
          type: boolean
          default: false
          description: 'If `true` on create, requires `require_account_confirmation: true` and immediately emails the confirmation link. On update, sends the confirmation email for an already-unconfirmed account.'
          example: true
        connect_username:
          type: string
          description: Undocumented in `mobile-worker.rst`. Links the new user to a ConnectID account instead of setting a password (`corehq/apps/api/resources/v0_5.py:278,334-338`). Requires the `COMMCARE_CONNECT` toggle; otherwise the request is rejected with a 400. See the discrepancy file.
          example: connect_jdoe
    UserErrorMessage:
      type: object
      description: Error body keyed `error_message` rather than the `error` key used by most other resources' error responses. Reached via tastypie's generic uncaught-exception handler (`wrap_view`'s `except Exception` -> `_handle_500`, `tastypie/resources.py:250-265,291-315`) whenever a custom `prepend_urls` view (`activate`/`deactivate`/`email_password_reset` on either resource) raises tastypie's own `NotFound()` -- that handler maps `NotFound` to a 404 status but always builds a generic canned message in production, never the raised exception's own text (`raise NotFound()` is called with no arguments on both resources in any case). See the discrepancy file.
