        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - xml_submission_file
              properties:
                xml_submission_file:
                  type: string
                  format: binary
                  description: The XForm submission XML as a file part.
          application/xml:
            schema:
              type: string
              description: The raw XForm submission XML as the entire request body.
