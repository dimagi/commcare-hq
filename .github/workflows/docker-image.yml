name: Build Test Docker Image
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.secret_source == 'Actions' }}
    runs-on: ubuntu-latest
    steps:
      # Audit-only: records egress from the runner, never fails the build.
      # Tighten to egress-policy: block once audit logs confirm the endpoint list.
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Get Python version
        id: vars
        # produces a variable like python=py3.13
        run: echo "python=py$(cat .python-version)" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          username: dimagi
          password: ${{ secrets.DOCKERHUB_RW_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          tags: dimagi/commcarehq-${{ steps.vars.outputs.python }}
          push: true
