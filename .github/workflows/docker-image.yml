name: Build Test Docker Image
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.secret_source == 'Actions' }}
    runs-on: ubuntu-latest
    steps:
      # Audit-only: records egress from the runner, never fails the build.
      # Tighten to egress-policy: block once audit logs confirm the endpoint list.
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get Python version
        id: vars
        # produces a variable like python=py3.13
        run: echo "python=py$(cat .python-version)" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: dimagi
          password: ${{ secrets.DOCKERHUB_RW_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: dimagi/commcarehq-${{ steps.vars.outputs.python }}
          push: true
