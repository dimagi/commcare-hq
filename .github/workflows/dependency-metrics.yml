name: commcare-hq dependency metrics
on:
  schedule:
  - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    env:
      REPO: commcare-hq
      DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
    steps:
      # Audit-only: records egress from the runner, never fails the build.
      # Tighten to egress-policy: block once audit logs confirm the endpoint list.
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Install python and dev-requirements
        run: uv sync --all-groups --locked --compile-bytecode --no-progress
      - name: run metrics for pip
        run: uv run --no-sync metrics pip --send
      - name: run metrics for yarn
        run: uv run --no-sync metrics yarn --send
