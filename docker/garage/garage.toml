# Single-node Garage for local development. NOT FOR PRODUCTION.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# NOTE: INSECURE, FOR LOCAL DEVELOPMENT ONLY (Garage requires 64 hex chars)
rpc_secret = "1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec"

[s3_api]
# boto3 signs with us-east-1 when no region is configured, which is how
# S3_BLOB_DB_SETTINGS is used by HQ
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
