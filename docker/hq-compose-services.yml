services:
  formplayer:
    extends:
      file: hq-compose.yml
      service: formplayer
    depends_on:
      - postgres
      - redis
    expose:
      - 8080
    ports:
      - "8080:8080"
      - "8081:8081"

  postgres:
    extends:
      file: hq-compose.yml
      service: postgres
    ports:
      - "5432:5432"

  couch:
    extends:
      file: hq-compose.yml
      service: couch
    ports:
      - "5984:5984"

  redis:
    extends:
      file: hq-compose.yml
      service: redis
    ports:
      - "6379:6379"

  elasticsearch6:
    extends:
      file: hq-compose.yml
      service: elasticsearch6
    command: elasticsearch
    environment:
      ES_CLUSTER_NAME: ${ES_CLUSTER_NAME}
    ports:
      - "9200:9200"

  kafka:
    extends:
      file: hq-compose.yml
      service: kafka
    ports:
      - "9092:9092"

  # A separate Kafka broker for tests, so that tests and the dev
  # environment do not consume each other's changes. See DEV_SETUP.md.
  kafka-tests:
    extends:
      file: hq-compose.yml
      service: kafka
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181/hq-tests
      KAFKA_LISTENERS: HQ_KAFKA://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HQ_KAFKA://${KAFKA_HOSTNAME:-localhost}:9093
    healthcheck:
      test: bash -c 'exec 6<>/dev/tcp/localhost/9093'
    ports:
      - "9093:9093"
    volumes:
      - ${VOLUME_PREFIX}${BLANK_IF_TESTS-kafka-tests:}/kafka/kafka-logs-1

  zookeeper:
    extends:
      file: hq-compose.yml
      service: zookeeper
    ports:
      - "2181:2181"

  minio:
    extends:
      file: hq-compose.yml
      service: minio
    ports:
      - "9980:9980"
      - "9981:9981"

  garage:
    extends:
      file: hq-compose.yml
      service: garage
    ports:
      - "3900:3900"
